<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b31217">
  <title>Receitas Orçamentárias — 14 Quizzes | Professor Moreira</title>
  <style>
    :root {
      --vermelho: #b31217;
      --vermelho-escuro: #810b0f;
      --fundo: #f3f4f6;
      --texto: #1f2937;
      --branco: #ffffff;
      --borda: #e5e7eb;
      --verde: #198754;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    body.modo-quiz {
      overflow: hidden;
    }

    .topo {
      background: linear-gradient(135deg, var(--vermelho-escuro), var(--vermelho));
      color: var(--branco);
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }

    .topo h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2.25rem);
    }

    .topo p {
      margin: 8px 0 0;
      opacity: .95;
      font-size: 1rem;
    }

    .conteudo {
      width: min(1100px, calc(100% - 28px));
      margin: 24px auto 40px;
    }

    .aviso {
      background: var(--branco);
      border-left: 5px solid var(--vermelho);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,.07);
      line-height: 1.5;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .cartao {
      appearance: none;
      width: 100%;
      border: 1px solid var(--borda);
      border-radius: 15px;
      background: var(--branco);
      padding: 20px 14px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 5px 14px rgba(0,0,0,.08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      color: var(--texto);
    }

    .cartao:hover,
    .cartao:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 9px 20px rgba(0,0,0,.13);
      border-color: var(--vermelho);
      outline: none;
    }

    .numero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--vermelho);
      color: var(--branco);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .cartao strong {
      display: block;
      color: var(--vermelho-escuro);
      font-size: 1.08rem;
    }

    .cartao span:last-child {
      display: block;
      margin-top: 6px;
      color: #6b7280;
      font-size: .9rem;
    }

    #visualizador {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--branco);
    }

    #visualizador.ativo {
      display: flex;
      flex-direction: column;
    }

    .barra-quiz {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--vermelho-escuro);
      color: var(--branco);
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      z-index: 2;
    }

    .barra-quiz button {
      border: 0;
      border-radius: 9px;
      min-height: 40px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 700;
      font-size: .92rem;
    }

    .btn-menu {
      background: var(--branco);
      color: var(--vermelho-escuro);
    }

    .btn-nav {
      background: rgba(255,255,255,.16);
      color: var(--branco);
      border: 1px solid rgba(255,255,255,.35) !important;
    }

    .btn-nav:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .titulo-quiz {
      flex: 1;
      text-align: center;
      font-weight: 700;
      padding: 0 6px;
    }

    #quadro {
      width: 100%;
      flex: 1;
      border: 0;
      background: var(--branco);
    }

    .rodape {
      text-align: center;
      color: #6b7280;
      padding: 20px 10px 30px;
      font-size: .9rem;
    }

    @media (max-width: 620px) {
      .barra-quiz {
        gap: 6px;
        padding: 8px;
      }

      .barra-quiz button {
        padding: 7px 9px;
        font-size: .82rem;
      }

      .titulo-quiz {
        font-size: .87rem;
      }

      .grade {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cartao {
        padding: 16px 8px;
      }
    }
  </style>
</head>
<body>

    <h1>Receitas Orçamentárias</h1>
    <p>14 Quizzes — Curso de Contabilidade Professor Moreira</p>
  </header>

      <button class="btn-nav" id="proximo" type="button" onclick="mudarQuiz(1)">Próximo →</button>
    </div>
    <iframe id="quadro" title="Conteúdo do quiz"></iframe>

    function decodificarBase64Utf8(base64) {
      const bytes = Uint8Array.from(atob(base64), caractere => caractere.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function montarMenu() {

        botao.type = "button";
        botao.className = "cartao";
        botao.innerHTML = `
          <span class="numero">${String(quiz.numero).padStart(2, "0")}</span>
          <strong>${quiz.titulo}</strong>
          <span>10 questões</span>
        `;
        botao.addEventListener("click", () => abrirQuiz(indice));
        grade.appendChild(botao);
      });
    }

    function abrirQuiz(indice) {
      if (indice < 0 || indice >= quizzes.length) return;

      indiceAtual = indice;
      const quiz = quizzes[indice];
      tituloAtual.textContent = `${quiz.titulo} de ${quizzes.length}`;
      anterior.disabled = indice === 0;
      proximo.disabled = indice === quizzes.length - 1;

      quadro.srcdoc = decodificarBase64Utf8(quiz.conteudo);
      visualizador.classList.add("ativo");
      visualizador.setAttribute("aria-hidden", "false");
      document.body.classList.add("modo-quiz");
      window.scrollTo(0, 0);
    }

    function mudarQuiz(direcao) {
      abrirQuiz(indiceAtual + direcao);
    }

    function voltarAoMenu() {
      quadro.srcdoc = "";
      indiceAtual = -1;
      visualizador.classList.remove("ativo");
      visualizador.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modo-quiz");
      window.scrollTo(0, 0);
    }

    document.addEventListener("keydown", evento => {
      if (!visualizador.classList.contains("ativo")) return;

      if (evento.key === "Escape") voltarAoMenu();
      if (evento.altKey && evento.key === "ArrowLeft" && indiceAtual > 0) mudarQuiz(-1);
      if (evento.altKey && evento.key === "ArrowRight" && indiceAtual < quizzes.length - 1) mudarQuiz(1);
    });

    montarMenu();
  </script>
</body>
</html>
