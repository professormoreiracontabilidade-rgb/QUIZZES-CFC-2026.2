espesa realizada.","d)  o valor empenhado era insuficiente para atender à despesa a ser realizada."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA anulação parcial do empenho ocorre quando apenas parte do valor reservado deixa de ser necessária.\n\nIsso acontece, por exemplo, quando:\n• o valor efetivamente realizado é menor que o valor empenhado;\n• há redução parcial do objeto contratado;\n• existe saldo não utilizado.\n\nSe o valor do empenho exceder o montante da despesa realizada, anula-se apenas a diferença.\n\nQuando o objeto não é cumprido integralmente, pode haver anulação total. Se o valor empenhado for insuficiente, será necessário reforço do empenho, e não anulação."},{"bank":"FGV - AFCE (TCE-SC)/TCE SC/Ciências Contábeis/2026","num":"115","stem":"O planejamento é a etapa da despesa orçamentária que abrange, de um modo geral, a análise para a formulação do plano e das ações governamentais que servirão de base para a fixação da despesa orçamentária.<br><br>\n\nA fixação da despesa refere-se aos limites de gastos incluídos nas leis orçamentárias e tem como base","options":["a)  a inflação projetada.","b)  as receitas previstas.","c)  as despesas executadas no exercício anterior.","d)  o crescimento estimado do Produto Interno Bruto.","e)  os gastos necessários para o funcionamento da máquina pública."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA fixação da despesa representa a definição dos limites de gastos autorizados na Lei Orçamentária Anual.\n\nEsses limites têm como base as receitas previstas para o exercício.\n\nIsso decorre do equilíbrio orçamentário: a despesa autorizada deve guardar compatibilidade com os recursos que o ente espera arrecadar.\n\nInflação, crescimento do PIB, gastos anteriores e necessidades administrativas podem influenciar o planejamento, mas a base direta da fixação são as receitas previstas."},{"bank":"FGV - AFCE (TCE-SC)/TCE SC/Ciências Econômicas/2026","num":"116","stem":"Nos termos da Lei nº 4.320/1964, a execução da despesa orçamentária ocorre em três estágios: empenho, liquidação e pagamento. Com base nessas fases da execução orçamentária e financeira, analise as afirmativas a seguir.<br><br>\n\nI. O empenho é o primeiro estágio da despesa e consiste no ato emanado de autoridade competente que cria para o Estado obrigação de pagamento, pendente ou não de implemento de condição.<br><br>\n\nII. A liquidação da despesa consiste na verificação do direito adquirido pelo credor, com base nos títulos e documentos comprobatórios do respectivo crédito.<br><br>\n\nIII. O pagamento pode ser efetuado antes da liquidação, desde que a despesa tenha sido previamente empenhada e exista disponibilidade financeira.<br><br>\n\nEstá correto o que se afirma em","options":["a)  I, apenas.","b)  II, apenas.","c)  III, apenas.","d)  I e II, apenas.","e)  I, II e III."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA afirmativa I está correta.\nO empenho é o ato da autoridade competente que cria para o Estado obrigação de pagamento, pendente ou não de condição.\n\nA afirmativa II está correta.\nA liquidação verifica o direito adquirido pelo credor com base nos documentos comprobatórios.\n\nA afirmativa III está incorreta.\nO pagamento somente pode ocorrer depois da regular liquidação da despesa.\n\nLogo, estão corretas apenas as afirmativas I e II."},{"bank":"FGV - Aud (CAGE RS)/SEFAZ RS/2025","num":"117","stem":"Ana Cláudia é uma Auditora Interna Governamental e está auditando as fases de execução orçamentária de uma entidade pública. O objetivo dela é verificar a conformidade dos processos de empenho, liquidação e pagamento, assegurando que a execução orçamentária esteja em conformidade com as normas e os regulamentos aplicáveis.<br><br>\n\nAo revisar uma série de empenhos realizados, Ana Cláudia observou que um processo foi empenhado sem o devido crédito orçamentário disponível.<br><br>\n\nNessa situação, Ana Cláudia deve","options":["a)  ignorar a inconsistência, pois a liquidação corrigirá o erro.","b)  informar ao gestor da área para que providencie um ajuste no sistema.","c)  recomendar um ajuste de crédito orçamentário ao final do exercício financeiro.","d)  permitir a continuidade do processo, pois o empenho será ajustado na fase de pagamento.","e)  determinar a anulação do empenho e o reinício do processo com a disponibilidade de crédito."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nÉ vedada a realização de despesa sem prévio empenho e sem crédito orçamentário disponível.\n\nSe o empenho foi emitido sem dotação suficiente, ele é irregular e deve ser anulado.\n\nDepois disso, o processo deverá ser reiniciado quando houver:\n• crédito orçamentário disponível;\n• dotação adequada;\n• observância dos requisitos legais.\n\nA liquidação ou o pagamento não corrigem a ausência de crédito no momento do empenho."},{"bank":"FGV - Aud (CAGE RS)/SEFAZ RS/2025","num":"118","stem":"O processo Licitatório e as fases da despesa pública constituem etapas do Ciclo de Compras que, customizado para o setor público envolve, nesta ordem:","options":["a)  Recebimento das requisições de compra – Instrução processual – Licitação – Empenho – Liquidação – Pagamento.","b)  Licitação – Empenho – Liquidação – Pagamento – Instrução processual – Recebimento das requisições de compras.","c)  Licitação – Instrução processual – Empenho – Liquidação – Pagamento – Recebimento das requisições de compras.","d)  Empenho – Liquidação – Pagamento – Instrução processual – Licitação – Recebimento das requisições de compra.","e)  Instrução processual – Recebimento das requisições de compra – Licitação – Empenho – Liquidação – Pagamento."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nO ciclo de compras no setor público segue uma sequência lógica:\n\n1. Recebimento da requisição de compra;\n2. Instrução processual;\n3. Realização da licitação;\n4. Emissão do empenho;\n5. Liquidação da despesa;\n6. Pagamento.\n\nPrimeiro é identificada a necessidade. Depois, o processo é formalizado e instruído. Em seguida ocorre a seleção do fornecedor, o comprometimento da dotação, a verificação do direito do credor e, por fim, o pagamento."},{"bank":"FGV - Ana CI (Pref Canaã Carajás)/Pref Canaã Carajás/2025","num":"119","stem":"Em relação às etapas das receitas e das despesas orçamentárias, analise o que se afirma a seguir.<br><br>\n\nI. Arrecadação<br><br>\n\nII. Execução<br><br>\n\nIII. Lançamento<br><br>\n\nIV. Planejamento<br><br>\n\nV. Recolhimento<br><br>\n\nRepresentam etapas da despesa orçamentária, o que se afirma em","options":["a)  I e III, apenas.","b)  II e IV, apenas.","c)  I e V, apenas.","d)  IV e V, apenas.","e)  II e III, apenas."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nAs etapas da despesa orçamentária são:\n• planejamento;\n• execução.\n\nNa etapa de planejamento estão, entre outros procedimentos, a fixação da despesa, a descentralização de créditos e a programação orçamentária e financeira.\n\nNa etapa de execução estão os estágios:\n• empenho;\n• liquidação;\n• pagamento.\n\nArrecadação, lançamento e recolhimento são etapas da receita orçamentária."},{"bank":"FGV - AJ TRT24/TRT 24/Administrativa/\"Sem Especialidade\"/2025","num":"120","stem":"Uma entidade do setor público realizou um processo de licitação com o objetivo de contratar um serviço com as melhores condições.<br><br>\n\nPara a realização da despesa orçamentária, assinale a opção que indica a etapa em que esse processo ocorreu.","options":["a)  Empenho.","b)  Liquidação.","c)  Pagamento.","d)  Planejamento.","e)  Reconhecimento."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA licitação integra a etapa de planejamento da despesa orçamentária.\n\nNessa etapa são realizados os procedimentos anteriores à execução, como:\n• identificação da necessidade;\n• elaboração do termo de referência ou projeto básico;\n• estimativa de preços;\n• escolha da forma de contratação;\n• realização da licitação.\n\nDepois da contratação, inicia-se a execução da despesa com empenho, liquidação e pagamento."}]}];
let blockIndex=null,screenIndex=0,answers=[];
const STORAGE='prof_moreira_despesas_120_v1';
function getState(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){return {}}}
function saveState(){if(blockIndex===null)return;const s=getState();s.lastBlock=blockIndex;s.lastScreen=screenIndex;s.answers=s.answers||{};s.answers[blockIndex]=answers;localStorage.setItem(STORAGE,JSON.stringify(s))}
function buildIndex(){const grid=document.getElementById('indexGrid');grid.innerHTML=blocks.map((b,i)=>`<button class="quiz-card" onclick="startQuiz(${i})"><h3>Quiz ${String(i+1).padStart(2,'0')}</h3><p>Questões ${b.start} a ${b.end}</p></button>`).join('');const s=getState(),r=document.getElementById('resume');if(Number.isInteger(s.lastBlock)&&blocks[s.lastBlock]){const b=blocks[s.lastBlock];r.style.display='block';r.innerHTML=`<strong>Continuar de onde parou</strong><br><span>Quiz ${String(s.lastBlock+1).padStart(2,'0')} — Questões ${b.start} a ${b.end}</span><br><button class="btn btn-primary" onclick="resumeQuiz()">Continuar</button>`}}
function resumeQuiz(){const s=getState();startQuiz(s.lastBlock,true)}
function startQuiz(i,resume=false){blockIndex=i;const b=blocks[i],s=getState();answers=(s.answers&&s.answers[i])||Array(b.questions.length).fill(null);screenIndex=resume&&Number.isInteger(s.lastScreen)?Math.min(s.lastScreen,b.questions.length*2):0;document.getElementById('indexScreen').classList.add('hidden');document.getElementById('quizArea').classList.remove('hidden');document.getElementById('nav').classList.remove('hidden');render();scrollTo(0,0)}
function totalScreens(){return blocks[blockIndex].questions.length*2+1}
function render(){const b=blocks[blockIndex],qs=b.questions,screen=document.getElementById('screen'),counter=document.getElementById('counter');document.getElementById('progress').style.width=((screenIndex+1)/totalScreens()*100)+'%';if(screenIndex===qs.length*2){const correct=answers.reduce((s,a,i)=>s+(a===qs[i].answer?1:0),0);counter.textContent=`Quiz ${String(blockIndex+1).padStart(2,'0')} — Resultado`;screen.innerHTML=`<div class="final"><h2>Quiz concluído!</h2><div class="score">${correct} / ${qs.length}</div><div class="result-grid"><div class="result-box"><strong>${correct}</strong><br>Acertos</div><div class="result-box"><strong>${qs.length-correct}</strong><br>Erros</div></div><p>Use “Reiniciar” para refazer ou “Índice” para escolher outro bloco.</p></div>`;saveState();return}const qi=Math.floor(screenIndex/2),exp=screenIndex%2===1,q=qs[qi];counter.textContent=`Quiz ${String(blockIndex+1).padStart(2,'0')} • Tela ${screenIndex+1} de ${totalScreens()}`;if(!exp){const opts=q.options.map((o,i)=>{const l=String.fromCharCode(97+i),sel=answers[qi]===l?'selected':'';return `<button class="option ${sel}" onclick="selectAnswer('${l}')">${o}</button>`}).join('');screen.innerHTML=`<div class="badge">Questão ${q.num}</div><div class="bank">${q.bank}</div><div class="question">${q.stem}</div><div class="options">${opts}</div><div id="feedback" class="feedback"></div>`;if(answers[qi])showFeedback(qi)}else{screen.innerHTML=`<div class="badge">Explicação da questão ${q.num}</div><div class="answer-title">Gabarito: ${q.answer.toUpperCase()}</div><div class="explanation">${q.explanation}</div>`}saveState()}
function selectAnswer(l){answers[Math.floor(screenIndex/2)]=l;render()}
function showFeedback(i){const f=document.getElementById('feedback');if(!f)return;const ok=answers[i]===blocks[blockIndex].questions[i].answer;f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'Resposta correta!':'Resposta registrada. Confira a explicação na próxima tela.'}
function nextScreen(){if(screenIndex<totalScreens()-1){screenIndex++;render();scrollTo(0,0)}}
function prevScreen(){if(screenIndex>0){screenIndex--;render();scrollTo(0,0)}}
function restartQuiz(){if(blockIndex===null)return;answers=Array(blocks[blockIndex].questions.length).fill(null);screenIndex=0;render();scrollTo(0,0)}
function goHome(){saveState();blockIndex=null;document.getElementById('quizArea').classList.add('hidden');document.getElementById('nav').classList.add('hidden');document.getElementById('indexScreen').classList.remove('hidden');document.getElementById('progress').style.width='0';buildIndex();scrollTo(0,0)}
buildIndex();
</script></body></html>
