analisado, mesmo considerando um cenário de superávit primário’”. (Fonte: Agência Câmara de Notícias)<br><br>\n\nCom a expectativa de aumento da dívida pública em 2027, o presidente, com o auxílio da sua equipe de planejamento, deverá acompanhar, conforme a Lei nº 4.320/1964:","options":["a)  as despesas de custeio em relação aos juros da dívida pública e as inversões financeiras em relação à amortização da dívida pública;","b)  as despesas de custeio em relação aos juros da dívida pública e as transferências de capital em relação à amortização da dívida pública;","c)  as transferências correntes em relação aos juros da dívida pública e as transferências de capital em relação à amortização da dívida pública;","d)  as transferências correntes em relação aos juros da dívida pública e as inversões financeiras em relação à amortização da dívida pública;","e)  as despesas de custeio em relação aos juros da dívida pública e os investimentos em relação à amortização da dívida pública."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nSegundo a Lei nº 4.320/1964:\n• os juros da dívida pública são classificados como transferências correntes;\n• a amortização da dívida pública é classificada como transferência de capital.\n\nOs juros representam encargos financeiros do endividamento e não reduzem o principal da dívida.\n\nA amortização corresponde ao pagamento do principal, reduzindo o saldo devedor. Por isso, integra as transferências de capital."},{"bank":"FGV - AFFC (STN)/STN/Contábil/2024","num":"54","stem":"Uma entidade do setor público apresentou despesas orçamentárias com (1) a aquisição de imóveis e bens de capital em utilização, no valor de R$100.000, e (2) com softwares e planejamento de obras, no valor de R$150.000. Essas despesas são classificadas, respectivamente, como","options":["a)  investimentos e inversões financeiras.","b) inversões financeiras e investimentos.","c) investimentos e outras despesas correntes.","d)  inversões financeiras e outras despesas correntes.","e)  outras despesas correntes e inversões financeiras."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA aquisição de imóveis e bens de capital já em utilização é classificada como inversão financeira.\n\nJá as despesas com softwares e planejamento de obras integram os investimentos, pois estão relacionadas à formação, aquisição ou melhoria de ativos de capital.\n\nAssim:\n• aquisição de imóveis e bens de capital em utilização: inversões financeiras;\n• softwares e planejamento de obras: investimentos."},{"bank":"FGV - Aux Tec CE (TCE-PA)/TCE PA/\"Sem Área\"/2024","num":"55","stem":"Em uma entidade do setor público, as despesas orçamentárias de capital não mantêm uma correlação com o registro de","options":["a)  desincorporação de um passivo.","b)  incorporação de ativo intangível.","c)  incorporação de ativo imobilizado.","d)  incorporação de ativo classificado como investimento.","e)  desincorporação de ativo circulante."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nAs despesas de capital normalmente mantêm correlação com:\n• incorporação de ativo imobilizado;\n• incorporação de ativo intangível;\n• incorporação de investimentos;\n• desincorporação de passivo, como ocorre na amortização da dívida.\n\nA desincorporação de ativo circulante não representa correlação típica com uma despesa orçamentária de capital.\n\nPor isso, a alternativa correta é a letra E."},{"bank":"FGV - Aud CE (TCE-PA)/TCE PA/Administrativa/Contabilidade/2024","num":"56","stem":"Uma entidade do setor público apresentava os seguintes saldos relacionados a suas despesas orçamentárias em 31/12/2023:<br><br>\n\n<div class=\"table-wrap\">\n<table>\n<tr><td>Correção Monetária ou Cambial da Dívida Contratual Resgatada:</td><td>R$40.000</td></tr>\n<tr><td>Juros sobre a Dívida por Contrato:</td><td>R$50.000</td></tr>\n<tr><td>Equipamentos e material permanente:</td><td>R$80.000</td></tr>\n<tr><td>Obras públicas e instalações:</td><td>R$120.000</td></tr>\n</table>\n</div><br>\n\nO total do grupo de natureza da despesa orçamentária Investimentos foi","options":["a)  R$80.000.","b)  R$120.000.","c)  R$200.000.","d)  R$250.000.","e)  R$290.000."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nIntegram o grupo Investimentos:\n• Equipamentos e material permanente: R$ 80.000;\n• Obras públicas e instalações: R$ 120.000.\n\nCálculo:\n\nR$ 80.000 + R$ 120.000 = R$ 200.000.\n\nA correção monetária ou cambial da dívida contratual resgatada e os juros sobre a dívida por contrato pertencem ao grupo Juros e Encargos da Dívida, e não ao grupo Investimentos."},{"bank":"FGV - Aud CE (TCE-PA)/TCE PA/Planejamento/Economia/2024","num":"57","stem":"Em relação à classificação das Receitas e Despesas Públicas, segundo o Manual Técnico do Orçamento, assinale a afirmativa correta.","options":["a)  As despesas correntes são destinadas ao custeio das atividades administrativas e operacionais do governo.","b)  As receitas de capital incluem alienação de bens, amortização de empréstimos concedidos e transferências correntes.","c)  As receitas correntes são provenientes impostos, contribuições, serviços e transferências em geral.","d)  As despesas de capital englobam investimentos, inversões financeiras, amortização da dívida e encargos sociais.","e)  O exercício financeiro no Brasil não coincide com o ano civil, tendo início em 1º de julho e término em 30 de junho do ano seguinte."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nAs despesas correntes são destinadas à manutenção e ao custeio das atividades administrativas e operacionais do governo.\n\nAs demais alternativas apresentam incorreções:\n• transferências correntes não integram receitas de capital;\n• a expressão “transferências em geral” torna a alternativa C imprecisa, pois existem transferências correntes e de capital;\n• encargos sociais integram despesas correntes, e não despesas de capital;\n• o exercício financeiro no Brasil coincide com o ano civil, iniciando em 1º de janeiro e terminando em 31 de dezembro."},{"bank":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024","num":"58","stem":"Em relação às despesas orçamentárias, avalie se as despesas a seguir são classificadas como despesas correntes:<br><br>\n\nI. Despesas de custeio.<br><br>\nII. Investimentos.<br><br>\nIII. Inversões Financeiras.<br><br>\n\nEstá correto o que se apresenta em","options":["a)  I, apenas.","b)  I e II, apenas.","c)  I e III, apenas.","d)  II e III, apenas."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nSomente as despesas de custeio são classificadas como despesas correntes.\n\nOs investimentos e as inversões financeiras pertencem à categoria econômica Despesas de Capital.\n\nAssim:\n• I — despesa corrente;\n• II — despesa de capital;\n• III — despesa de capital.\n\nLogo, apenas o item I está correto."},{"bank":"FGV - Adv (EPE)/EPE/2024","num":"59","stem":"A lei do orçamento deve dispor das receitas, das despesas, dos créditos suplementares, das inversões financeiras etc. Considerando essa diversidade de conceitos, podemos afirmar que as dotações destinadas à aquisição de bens de capital já em utilização, são","options":["a)  inversões financeiras.","b) créditos suplementares.","c) despesas correntes.","d) receitas correntes.","e) transferências correntes."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nAs dotações destinadas à aquisição de bens de capital já em utilização são classificadas como inversões financeiras.\n\nA classificação decorre do fato de o bem já estar pronto e em uso, não havendo formação de novo bem de capital por meio de obra ou fabricação.\n\nAs demais alternativas não correspondem à natureza dessa despesa."},{"bank":"FGV - ATTM (Pref Nova Iguaçu)/Pref Nova Iguaçu/2024","num":"60","stem":"As despesas de custeio são dotações destinadas à manutenção de serviços anteriormente criados, incluindo, dentre outras, as obras de conservação e pagamento de pessoal.<br><br>\n\nEssas despesas estão inseridas, quanto à classificação econômica, como","options":["a)  investimentos.","b)  de capital.","c)  inversões financeiras.","d)  correntes.","e)  transferências de capital"],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs despesas de custeio pertencem à categoria econômica Despesas Correntes.\n\nElas são destinadas à manutenção e ao funcionamento de serviços já existentes, incluindo:\n• pagamento de pessoal;\n• aquisição de material de consumo;\n• serviços de terceiros;\n• obras de conservação e manutenção.\n\nNão representam formação ou aquisição de novo bem de capital, razão pela qual não são classificadas como investimentos, inversões financeiras ou transferências de capital."}]},{"id":7,"start":61,"end":70,"questions":[{"bank":"FGV - AGC (EPE)/EPE/Finanças e Orçamento/2024","num":"61","stem":"No que diz respeito à classificação orçamentária da despesa, temos diversas possibilidades, a saber:<br><br>\n\nI. a classificação que permite identificar o programa de trabalho do governo segundo Órgãos e Unidades Orçamentárias (UO's).<br>\nII. a classificação que permite identificar as áreas nas quais as despesas ocorrem; ou ainda.<br>\nIII. a classificação que possibilita a obtenção de informações macroeconômicas sobre os efeitos dos gastos do setor público na economia.<br><br>\n\nO texto caracteriza, respectivamente, as seguintes classificações da despesa pública:","options":["a) institucional, funcional e por natureza da despesa.","b) por natureza da despesa, institucional e funcional.","c) funcional, institucional e por natureza da despesa.","d) institucional, por natureza da despesa e funcional.","e) esfera orçamentária, funcional e institucional."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nI. A classificação institucional identifica os órgãos e as unidades orçamentárias responsáveis pela execução do orçamento.\n\nII. A classificação funcional identifica as áreas de atuação governamental em que as despesas são realizadas, por meio de funções e subfunções.\n\nIII. A classificação por natureza da despesa possibilita análises econômicas e macroeconômicas, pois evidencia a categoria econômica, o grupo de natureza da despesa, a modalidade de aplicação e o elemento de despesa.\n\nLogo, a sequência correta é: institucional, funcional e por natureza da despesa."},{"bank":"FGV - AGC (EPE)/EPE/Finanças e Orçamento/2024","num":"62","stem":"Na estrutura atual, o orçamento público está organizado em programas de trabalho, que contêm informações qualitativas e quantitativas. A estrutura completa da programação orçamentária é formada por uma sequência de códigos alfanuméricos separados por pontos.<br><br>\n\nTrecho retirado do Manual Técnico do Orçamento, 2024<br><br>\n\nNa estrutura programática, cada seção do código alfanumérico se refere a um tipo de classificador orçamentário distinto. Assim, o código “252”, em destaque na despesa a seguir,<br><br>\n\n<strong>Despesa: 10.39.252.26.XXX..XXXX</strong> refere-se à(ao)","options":["a)  Unidade Orçamentária.","b)  Esfera Funcional.","c)  Função Institucional.","d)  Órgão Administrativo.","e)  Estágio Financeiro."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nNa estrutura apresentada, o código “252” identifica a Unidade Orçamentária.\n\nA Unidade Orçamentária é o agrupamento de serviços subordinados ao mesmo órgão ou repartição a que são consignadas dotações próprias.\n\nEla integra a classificação institucional da despesa, que identifica:\n• o órgão orçamentário;\n• a unidade orçamentária responsável pela execução.\n\nPortanto, o código destacado corresponde à Unidade Orçamentária."},{"bank":"FGV - AGC (EPE)/EPE/Finanças e Orçamento/2024","num":"63","stem":"Quando se divulga a notícia de que o Ministério X despendeu R$10 milhões com ações de publicidade de utilidade pública, avalie se estão explícitos os seguintes elementos para classificação da despesa, segundo sua programação orçamentária:<br><br>\n\nI. Órgão.<br><br>\nII. Função e Valor da Despesa.<br>\nIII. Valor da Despesa.<br>\nIV. Ação.<br><br>\n\nEstá correto apenas o que se apresenta em","options":["a)  I e III.","b) I, II e III.","c) II e IV.","d) I e IV.","e)  II, III e IV."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA notícia informa expressamente:\n\n• Ministério X: identifica o órgão;\n• ações de publicidade de utilidade pública: identifica a ação orçamentária.\n\nAssim, estão explícitos os itens I e IV.\n\nEmbora o valor de R$ 10 milhões seja mencionado, a questão considera os elementos da programação orçamentária destacados na informação. A função governamental não está expressamente indicada.\n\nLogo, a resposta correta é I e IV."},{"bank":"FGV - Cont (Pref Nova Iguaçu)/Pref Nova Iguaçu/2024","num":"64","stem":"Um Município construiu casas populares para doar à população que havia perdido a sua moradia, em função de fortes chuvas. As despesas com a execução das obras devem ser classificadas como","options":["a)  despesas de capital - investimentos.","b)  despesas correntes - despesas de custeio.","c)  despesas de capital - inversões financeiras.","d)  despesas de capital - transferências de capital.","e)  despesas correntes - transferências correntes."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA construção de casas populares representa execução de obra e formação de novos bens de capital.\n\nPor isso, a despesa é classificada como:\n• categoria econômica: despesa de capital;\n• grupo: investimentos.\n\nO fato de as casas serem posteriormente doadas não altera a natureza da despesa realizada durante a construção.\n\nNão se trata de inversão financeira, pois não houve aquisição de bem já em utilização, nem de transferência de capital, pois o Município executou diretamente a obra."},{"bank":"FGV - Cont (Pref Nova Iguaçu)/Pref Nova Iguaçu/2024","num":"65","stem":"As despesas de capital estão relacionadas quanto à categoria econômica e possui como característica aumento patrimonial resultante de mutação compensatória do bem. Assinale a opção que possui todas essas dotações.","options":["a)  Investimentos e transferências correntes.","b)  Despesas de custeio e transferências de capital.","c)  Investimentos, inversões financeiras, transferências de capital.","d)  Transferências correntes, despesas de custeio e inversões financeiras.","e)  Transferências correntes, transferências de capital e investimentos."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nSegundo a classificação econômica prevista na Lei nº 4.320/1964, as despesas de capital compreendem:\n\n• investimentos;\n• inversões financeiras;\n• transferências de capital.\n\nInvestimentos e inversões financeiras normalmente resultam em incorporação de ativos ou formação de bens de capital.\n\nAs transferências de capital destinam-se a investimentos, inversões financeiras ou amortização da dívida por outro ente ou entidade.\n\nDespesas de custeio e transferências correntes pertencem à categoria das despesas correntes."},{"bank":"FGV - AJ (TRF 1ª Região)/TRF 1/Administrativa/\"Sem Especialidade\"/2024","num":"66","stem":"Um servidor foi designado para analisar as informações a serem apresentadas no Demonstrativo da Execução das Despesas por Função e Subfunção. Ao analisar despesas da Câmara dos Deputados, o servidor verificou que a Ação nº 2010 – Assistência Pré-escolar aos Dependentes dos Servidores do Órgão foi incluída na subfunção 365 – Educação Infantil.<br><br>\n\nQuanto à função, o referido gasto deve constar como:","options":["a)  Educação;","b)  Legislativa;","c)  Administração;","d)  Assistência Social;","e)  Encargos Especiais."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA função representa a área de atuação predominante do órgão responsável pela despesa.\n\nComo a ação é executada pela Câmara dos Deputados, o gasto deve ser classificado na função Legislativa.\n\nA subfunção pode ser combinada com função diferente daquela à qual está originalmente vinculada, conforme a técnica da matricialidade.\n\nAssim, é possível registrar:\n• função: Legislativa;\n• subfunção: Educação Infantil.\n\nA despesa permanece vinculada à finalidade institucional do Poder Legislativo."},{"bank":"FGV - TJ (TRF 1ª Região)/TRF 1/Administrativa/\"Sem Especialidade\"/2024","num":"67","stem":"A Secretaria de Orçamento Federal (SOF) recebeu uma série de denúncias sobre destinação irregular de recursos do orçamento federal do exercício anterior que foram aplicados por outros entes da Federação e suas respectivas entidades em ações da área da cultura. Para iniciar uma apuração dessas denúncias, o secretário da SOF pediu um levantamento detalhado de todas as despesas que se enquadravam nesses critérios.<br><br>\n\nPara isso, foi consultada a classificação da despesa da referida área por:","options":["a)  elemento de despesa;","b)  grupo de natureza de despesa;","c)  identificador de uso;","d)  modalidade de aplicação;","e)  órgão e unidade orçamentária."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA modalidade de aplicação indica se os recursos foram aplicados diretamente pelo próprio ente ou transferidos para outro ente ou entidade.\n\nComo a investigação busca identificar despesas executadas por outros entes da Federação e suas respectivas entidades, a classificação adequada é a modalidade de aplicação.\n\nEla permite distinguir, por exemplo:\n• aplicação direta;\n• transferências à União;\n• transferências a estados;\n• transferências a municípios;\n• transferências a instituições privadas.\n\nPor isso, é o classificador mais adequado para o levantamento solicitado."},{"bank":"FGV - Ana Prev (MACAEPREV)/MACAEPREV/Administração/2024","num":"68","stem":"A despesa orçamentária é o gasto autorizado pelo governo, por meio do orçamento público, para a realização de suas atividades em um determinado período, geralmente um ano. Ela é composta por todos os dispêndios necessários para a manutenção das funções públicas, como saúde, educação, segurança, infraestrutura, entre outros.<br><br>\n\nAssinale a opção que apresenta a diferença entre despesas correntes e despesas de capital.","options":["a)  As despesas correntes incluem investimentos em infraestrutura e aquisição de imóveis, enquanto as despesas de capital são limitadas ao pagamento de pessoal e encargos sociais.","b)  As despesas de capital referem-se exclusivamente ao custeio da administração pública, enquanto as despesas correntes cobrem a amortização da dívida pública.","c)  As despesas de capital incluem todos os gastos com serviços públicos, enquanto as despesas correntes concentram-se na aquisição de ativos permanentes.","d)  As despesas correntes envolvem gastos necessários para a manutenção das atividades do governo, como pagamento de pessoal e compra de materiais, enquanto as despesas de capital referem-se aos investimentos e à amortização da dívida.","e)  As despesas correntes englobam a transferência de recursos para outros entes federativos, enquanto as despesas de capital limitam-se a projetos de curto prazo."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs despesas correntes destinam-se à manutenção e ao funcionamento das atividades governamentais.\n\nExemplos:\n• pagamento de pessoal;\n• aquisição de materiais de consumo;\n• contratação de serviços;\n• pagamento de juros e encargos da dívida.\n\nAs despesas de capital estão associadas à formação ou aquisição de ativos e à redução do endividamento.\n\nExemplos:\n• investimentos;\n• inversões financeiras;\n• amortização da dívida.\n\nPortanto, a alternativa D apresenta corretamente a diferença."},{"bank":"FGV - Ana Prev (MACAEPREV)/MACAEPREV/Contabilidade/2024","num":"69","stem":"Uma entidade do setor público apresentou, em 31/12/2023, o seguinte saldo em cada grupo de natureza da despesa:<br><br>\n\nOutras despesas correntes: R$30.000;<br><br>\n\nJuros e Encargos da Dívida: R$40.000;<br><br>\n\nAmortização da Dívida: R$90.000;<br><br>\n\nInversões Financeiras: R$120.000;<br><br>\n\nPessoal e Encargos Sociais: R$150.000;<br><br>\n\nInvestimentos: R$180.000.<br><br>\n\nNo ano, as despesas orçamentárias de capital apresentavam o seguinte saldo:","options":["a)  R$130.000","b)  R$210.000","c)  R$270.000","d)  R$300.000","e)  R$390.000."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nAs despesas de capital são formadas pelos seguintes grupos:\n• Investimentos: R$ 180.000;\n• Inversões Financeiras: R$ 120.000;\n• Amortização da Dívida: R$ 90.000.\n\nCálculo:\n\nR$ 180.000\n+ R$ 120.000\n+ R$ 90.000\n= R$ 390.000.\n\nOutras Despesas Correntes, Juros e Encargos da Dívida e Pessoal e Encargos Sociais são despesas correntes e não entram no cálculo."},{"bank":"FGV - AFTM (Pref Macaé)/Pref Macaé/2024","num":"70","stem":"Na execução orçamentária de uma ação realizada na função educação, observou-se que ela foi registrada no sistema de execução financeira, quanto à natureza da despesa, com o código<br><br>\n\n<strong>3.1.90.11.00.</strong><br><br>\n\nAssinale a opção que indica a despesa realizada.","options":["a)  Despesa de capital.","b)  Inversão financeira.","c)  Despesa com pessoal e encargos sociais.","d)  Transferência aos municípios.","e)  Juros e encargos da dívida."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nO código 3.1.90.11.00 pode ser interpretado da seguinte forma:\n\n• 3 — Despesa Corrente;\n• 1 — Pessoal e Encargos Sociais;\n• 90 — Aplicação Direta;\n• 11 — Vencimentos e Vantagens Fixas — Pessoal Civil;\n• 00 — desdobramento do elemento.\n\nPortanto, trata-se de despesa corrente com pessoal e encargos sociais, executada diretamente pelo ente.\n\nNão é despesa de capital, inversão financeira, transferência aos municípios ou juros e encargos da dívida."}]},{"id":8,"start":71,"end":80,"questions":[{"bank":"FGV - AMCI (Pref Macaé)/Pref Macaé/Contador/2024","num":"71","stem":"Na execução orçamentária de uma ação realizada na função educação, observou-se que ela foi registrada no sistema de execução financeira, quanto à natureza da despesa, com o código<br><br>\n\n<strong>3.1.90.11.00.</strong><br><br>\n\nAssinale a opção que indica a despesa realizada.","options":["a)  Despesa de capital.","b)  Inversão financeira.","c)  Despesa com pessoal e encargos sociais.","d)  Transferência aos municípios.","e)  Juros e encargos da dívida."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nO código 3.1.90.11.00 pode ser interpretado da seguinte forma:\n\n• 3 — Despesa Corrente;\n• 1 — Pessoal e Encargos Sociais;\n• 90 — Aplicação Direta;\n• 11 — Vencimentos e Vantagens Fixas — Pessoal Civil;\n• 00 — desdobramento do elemento de despesa.\n\nPortanto, trata-se de uma despesa corrente com pessoal e encargos sociais.\n\nNão é despesa de capital, inversão financeira, transferência aos municípios ou juros e encargos da dívida."},{"bank":"FGV - AJ (TJ RR)/TJ RR/Apoio à Gestão/2024","num":"72","stem":"As classificações orçamentárias da despesa pública organizam os gastos governamentais em categorias específicas para assegurar a transparência e o controle na alocação e execução dos recursos públicos.<br><br>\n\nAssinale a opção que apresenta uma desvantagem da classificação departamental.","options":["a)  Permite comparar imediatamente os vários órgãos, em termos de dotações recebidas.","b)  É um ponto de partida para o estabelecimento de um programa de contabilização de custos dos vários serviços ou unidades administrativas.","c)  Quando combinada com a classificação funcional, focaliza num único ponto a responsabilidade pela execução de determinado programa.","d)  Tende a gerar rivalidades interorganizacionais na obtenção de dotações, quando da preparação do orçamento e da sua aprovação no Legislativo.","e)  Permite identificar o agente responsável pelas dotações autorizadas pelo Legislativo, para dado programa."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA classificação departamental organiza as despesas conforme os órgãos e unidades responsáveis.\n\nEntre suas vantagens estão:\n• identificar o responsável pela execução;\n• permitir comparações entre órgãos;\n• facilitar o controle;\n• servir de base para a apuração de custos.\n\nUma desvantagem é a possibilidade de estimular rivalidades entre órgãos na disputa por dotações durante a elaboração e aprovação do orçamento.\n\nPor isso, a alternativa D apresenta a desvantagem solicitada."},{"bank":"FGV - AJ (TJ RR)/TJ RR/Contabilidade/2024","num":"73","stem":"De acordo com o Manual Técnico de Orçamento (MTO), o programa de trabalho que define qualitativamente a programação orçamentária deve responder, de maneira clara e objetiva, às perguntas clássicas que caracterizam o ato de orçar.<br><br>\n\nNesse sentido, a classificação funcional deve responder à seguinte pergunta:","options":["a)  Quem é o responsável por fazer?","b)  Qual é a localização geográfica da ação?","c)  Em que áreas de despesa a ação governamental será realizada?","d)  O que se pretende alcançar com a implementação da Política Pública?","e)  O que será desenvolvido para alcançar o objetivo do programa?"],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA classificação funcional indica em quais áreas de atuação governamental a despesa será realizada.\n\nEla é composta por:\n• função;\n• subfunção.\n\nAssim, responde à pergunta: “Em que áreas de despesa a ação governamental será realizada?”\n\nAs demais perguntas correspondem a outros classificadores:\n• quem é responsável: classificação institucional;\n• localização geográfica: subtítulo ou localizador;\n• o que se pretende alcançar: programa;\n• o que será desenvolvido: ação."},{"bank":"FGV - AGP (Pref Vitória)/Pref Vitória/Contador/2024","num":"74","stem":"Em 2022, uma entidade do setor público contratava uma pessoa jurídica para prestar o serviço de transporte diário a seus servidores, no início e no final do expediente. Em 2023, a entidade cancelou o contrato para a prestação do serviço de transporte e passou a fornecer aos servidores auxílio-transporte por meio de cartão magnético, para que fizessem sua locomoção por conta própria.<br><br>\n\nAssinale a opção que indica o elemento de despesa utilizado em 2022 e em 2023, respectivamente, relacionado ao transporte dos servidores.","options":["a)  13 – Obrigações Patronais e 14 – Diárias.","b)  11 – Vencimentos e Vantagens Fixas e 49 – Auxílio-Transporte.","c)  39 – Outros Serviços de Terceiros – Pessoa Jurídica e 42 – Auxílios.","d)  39 – Outros Serviços de Terceiros – Pessoa Jurídica e 49 – Auxílio-Transporte.","e)  04 – Contratação por Tempo Determinado e 33 – Passagens e Despesas com Locomoção."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nEm 2022, a entidade contratou uma pessoa jurídica para prestar o serviço de transporte. O elemento adequado é:\n\n• 39 — Outros Serviços de Terceiros — Pessoa Jurídica.\n\nEm 2023, o transporte deixou de ser prestado diretamente por empresa contratada e passou a ser concedido aos servidores por meio de cartão magnético. O elemento adequado é:\n\n• 49 — Auxílio-Transporte.\n\nPortanto, a sequência correta é 39 e 49."},{"bank":"FGV - ACI (Pref Vitória)/Pref Vitória/Administração/2024","num":"75","stem":"O instrumento de programação que envolve um conjunto de operações que se realizam de modo contínuo e permanente, resultando um produto ou serviço necessário à manutenção da ação do governo, e que tem como uma de suas características possuir objetivos que podem ser medidos quantitativamente e qualitativamente, é chamado de","options":["a)  atividade.","b)  projeto.","c)  subfunções.","d)  funções.","e)  programa."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA atividade é o instrumento de programação utilizado para operações contínuas e permanentes.\n\nEla:\n• mantém a ação governamental;\n• produz bens ou serviços de forma continuada;\n• possui objetivos que podem ser medidos quantitativa e qualitativamente.\n\nO projeto possui duração limitada e resulta na expansão ou aperfeiçoamento da ação governamental.\n\nFunção e subfunção são classificações funcionais. Programa reúne ações destinadas ao alcance de um objetivo."},{"bank":"FGV - ACI (Pref Vitória)/Pref Vitória/Administração/2024","num":"76","stem":"Na classificação por natureza de despesa, assinale V para afirmativa verdadeira e F para falsa.<br><br>\n\n( ) A categoria econômica da despesa é de primeiro nível, e nela estão contempladas as despesas orçamentárias correntes.<br><br>\n\n( ) O grupo de natureza da despesa é de segundo nível, e nele estão contempladas as inversões financeiras.<br><br>\n\n( ) A modalidade de aplicação é de terceiro nível, e nela estão contemplados os juros e encargos da dívida.<br><br>\n\nAs afirmativas são, respectivamente,","options":["a)  F - V - F.","b)  V - V - F.","c)  V - F-  F.","d)  F - V - V.","e)  V - F - V."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nPrimeira afirmativa: verdadeira.\nA categoria econômica é o primeiro nível da classificação por natureza da despesa. Nela estão as despesas correntes e as despesas de capital.\n\nSegunda afirmativa: verdadeira.\nO grupo de natureza da despesa é o segundo nível. Inversões Financeiras é um dos grupos das despesas de capital.\n\nTerceira afirmativa: falsa.\nJuros e Encargos da Dívida é grupo de natureza da despesa, e não modalidade de aplicação.\n\nLogo, a sequência é V – V – F."},{"bank":"FGV - ACI (Pref Vitória)/Pref Vitória/Administração/2024","num":"77","stem":"As despesas correntes e de capital são despesas orçamentárias representadas quanto às suas categorias econômicas. Segundo normas gerais, essas categorias econômicas são classificações orçamentárias detalhadas, conforme","options":["a)  seu critério de execução.","b)  sua atividade de programação.","c)  sua categoria programática.","d)  seu programa funcional.","e)  sua natureza."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nDespesas correntes e despesas de capital são categorias econômicas da classificação por natureza da despesa.\n\nA classificação por natureza detalha:\n• categoria econômica;\n• grupo de natureza da despesa;\n• modalidade de aplicação;\n• elemento de despesa;\n• eventual desdobramento do elemento.\n\nPor isso, essas categorias são classificadas conforme a natureza da despesa."},{"bank":"FGV - AJ (TJ MT)/TJ MT/Administração/2024","num":"78","stem":"No processo de elaboração do orçamento o órgão setorial, o órgão orçamentário e as Unidades Orçamentárias (UOs) exercem funções que não se confundem. A atuação das UOs no processo orçamentário compreende","options":["a)  análise e validação das propostas e das alterações orçamentárias de suas UOs.","b)  formalização da proposta e das alterações orçamentárias do órgão orçamentário.","c)  avaliação da adequação da estrutura programática e mapeamento das alterações necessárias.","d)  estudos de adequação da estrutura programática.","e)  coordenação do processo de atualização e aperfeiçoamento das informações constantes do cadastro de programas e ações."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs Unidades Orçamentárias participam diretamente da elaboração da proposta e devem realizar estudos de adequação da estrutura programática.\n\nIsso envolve verificar se os programas e ações existentes são suficientes e adequados às necessidades da unidade.\n\nAs demais atribuições estão relacionadas, em regra, aos órgãos setoriais ou ao órgão central de orçamento, como:\n• análise e validação de propostas;\n• formalização de alterações do órgão;\n• coordenação da atualização dos cadastros;\n• avaliação global da estrutura programática."},{"bank":"FGV - AJ (TJ MT)/TJ MT/Administração/2024","num":"79","stem":"Na classificação das despesas, as ações orçamentárias são tipificadas como “projetos”, “atividades” ou “operações especiais” e é identificada por um código alfanumérico de quatro dígitos, acrescido de quatro dígitos do localizado.<br><br>\n\nNesse sentido, é um dígito utilizado para identificação da ação do tipo “atividade” aquele representado pelo algarismo","options":["a)  0.","b)  4.","c)  3.","d)  1.","e)  7."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nNa identificação das ações orçamentárias:\n\n• projetos são identificados por códigos cujo primeiro dígito é 1, 3, 5 ou 7;\n• atividades são identificadas por códigos cujo primeiro dígito é 2, 4, 6 ou 8;\n• operações especiais são identificadas por códigos cujo primeiro dígito é 0.\n\nO algarismo 4 pode identificar uma ação do tipo atividade.\n\nPor isso, a alternativa correta é a letra B."},{"bank":"FGV - AJ (TJ MT)/TJ MT/Administração/2024","num":"80","stem":"O orçamento da União concernente à realização de despesa pública destinada à realização de determinada obra pública, verificou-se que<br><br>\n\nI. o objeto da despesa é a construção de um hospital estadual.<br><br>\n\nII. a execução da despesa exige o uso intensivo de modalidades de aplicação de transferências.<br><br>\n\nIII. a despesa se insere no âmbito de um programa federal de financiamento de ações de infraestrutura em saúde pública.<br><br>\n\nNo orçamento da União, a ação orçamentária deve ser classificada como","options":["a)  inversão financeira.","b)  projeto.","c)  atividade.","d)  despesa extraorçamentária.","e)  operação especial."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nEmbora a construção de um hospital seja materialmente uma obra, no orçamento da União a ação descrita representa transferência de recursos para que outro ente execute a infraestrutura.\n\nQuando a ação não resulta em produto direto para o ente que executa o orçamento e se caracteriza por transferências ou encargos sem contraprestação direta em bens ou serviços, ela é classificada como operação especial.\n\nAssim, no orçamento federal:\n• a União financia;\n• o hospital estadual é executado por outro ente;\n• não há produto diretamente gerado pela União.\n\nPor isso, a ação é uma operação especial."}]},{"id":9,"start":81,"end":90,"questions":[{"bank":"FGV - AJ (TJ MT)/TJ MT/Ciências Contábeis/2024","num":"81","stem":"Uma entidade do setor público apresentava os seguintes saldos em relação a suas despesas orçamentárias, no Balanço Orçamentário: Amortização da Dívida: R$ 10.000; Juros e Encargos da Dívida: R$ 30.000; Investimentos: R$ 40.000; Pessoal e Encargos Sociais: R$ 50.000; Inversões Financeiras: R$ 60.000; Outras Despesas Correntes: R$ 80.000.<br><br>\n\nO saldo das despesas de capital foi de","options":["a)  R$ 40.000.","b)  R$ 80.000.","c)  R$ 100.000.","d)  R$ 110.000.","e)  R$ 140.000."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs despesas de capital são formadas por:\n• Investimentos: R$ 40.000;\n• Inversões Financeiras: R$ 60.000;\n• Amortização da Dívida: R$ 10.000.\n\nCálculo:\n\nR$ 40.000 + R$ 60.000 + R$ 10.000 = R$ 110.000.\n\nJuros e Encargos da Dívida, Pessoal e Encargos Sociais e Outras Despesas Correntes pertencem às despesas correntes."},{"bank":"FGV - Aud Est (CGE SC)/CGE SC/Economia/2023","num":"82","stem":"Em uma entidade do setor público, as despesas orçamentárias relacionadas a serviços de consultoria e a planejamento e execução de obras são classificados, respectivamente, como","options":["a)  investimentos e investimentos.","b)  outras despesas correntes e investimentos.","c)  inversões financeiras e inversões financeiras.","d)  outras despesas correntes e inversões financeiras.","e)  outras despesas correntes e outras despesas correntes."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nOs serviços de consultoria representam, em regra, gasto de manutenção ou apoio técnico e são classificados como Outras Despesas Correntes.\n\nJá o planejamento e a execução de obras estão relacionados à formação ou melhoria de bens de capital, sendo classificados como Investimentos.\n\nPortanto:\n• serviços de consultoria: outras despesas correntes;\n• planejamento e execução de obras: investimentos."},{"bank":"FGV - Aud Est (CGE SC)/CGE SC/Ciências Contábeis/2023","num":"83","stem":"De acordo com o Decreto nº 1.323/12, as despesas orçamentárias são classificadas em correntes e de capital.<br><br>\n\nAssinale a opção que indica a distinção entre as despesas orçamentárias correntes e de capital.","options":["a)  As correntes são de curto prazo, enquanto as de capital são de longo prazo.","b)  As correntes são intragovernamentais, enquanto as de capital são intergovernamentais.","c)  As correntes aumentam o resultado, enquanto as de capital aumentam o patrimônio líquido.","d)  As correntes não se relacionam à manutenção de serviços existentes, enquanto as de capital se relacionam.","e)  As correntes não contribuem diretamente para a formação ou aquisição de um bem de capital, enquanto as de capital contribuem."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nAs despesas correntes são aquelas que não contribuem diretamente para a formação ou aquisição de bens de capital. Elas estão relacionadas à manutenção das atividades governamentais.\n\nAs despesas de capital contribuem diretamente para a formação ou aquisição de bens de capital ou para a redução do passivo, como ocorre na amortização da dívida.\n\nA distinção não depende de prazo, relação entre entes ou impacto automático no patrimônio líquido."},{"bank":"FGV - Cons Sub (TCE ES)/TCE ES/2023","num":"84","stem":"O controle das despesas é auxiliado por classificações predefinidas que permitem análises da alocação dos recursos públicos sob diferentes perspectivas.<br><br>\n\nSob a perspectiva da classificação funcional, inicialmente instituída pela Portaria nº 42/1999, considera-se que apresenta utilidade como agregador dos gastos públicos por área de ação governamental e:","options":["a)  depende da definição dos programas e ações em cada ciclo do Plano Plurianual;","b)  tem uma estrutura comum aplicável a todos os entes públicos, mas facultativa a Municípios de pequeno porte;","c)  por ser de aplicação comum, possibilita a consolidação nacional dos gastos do setor público;","d)  tem as categorias funcionais estabelecidas a partir da estrutura administrativa dos entes federativos;","e)  veda a combinação de subfunções típicas entre diferentes categorias funcionais."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA classificação funcional possui estrutura comum para todos os entes da Federação.\n\nPor essa razão, permite:\n• comparar gastos entre União, estados, Distrito Federal e municípios;\n• consolidar nacionalmente as despesas por área de atuação governamental;\n• analisar quanto foi gasto em educação, saúde, segurança, administração e outras funções.\n\nEla não depende da estrutura administrativa de cada ente e admite a combinação de subfunções com funções diferentes, conforme a técnica da matricialidade."},{"bank":"FGV - ACE (TCE ES)/TCE ES/Auditoria Governamental/2023","num":"85","stem":"O gestor máximo de um ente assumiu o compromisso de ser mais transparente na evidenciação dos gastos públicos. Uma das iniciativas foi instalar outdoors na cidade com gráficos e informações simplificadas sobre a execução do orçamento. Um ponto destacado pelo gestor foi que o cidadão deve ser informado sobre o que se pretende alcançar com a implementação de uma política pública.<br><br>\n\nNesse contexto, as informações mais apropriadas para que a assessoria de comunicação prepare o material informativo podem ser obtidas a partir da classificação da despesa por:","options":["a)  função;","b)  programas;","c)  identificador de uso;","d)  modalidade de aplicação;","e)  grupo de natureza de despesa."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nO programa expressa o que se pretende alcançar com a implementação de uma política pública.\n\nEle organiza as ações governamentais voltadas à solução de um problema ou ao atendimento de uma necessidade da sociedade.\n\nAs demais classificações respondem a outras perguntas:\n• função: em que área a despesa é realizada;\n• modalidade de aplicação: como os recursos serão aplicados;\n• grupo de natureza: qual a natureza econômica do gasto;\n• identificador de uso: vinculação relacionada a recursos específicos."},{"bank":"FGV - Cont (CGM RJ)/Pref RJ/2023","num":"86","stem":"Uma das classificações legais da despesa pública refere-se à classificação funcional, a qual segrega as dotações orçamentárias em funções e subfunções, buscando responder basicamente à indagação “em que área” de ação governamental a despesa será realizada.<br><br>\n\nNesse contexto, considerando que se enquadre na função Administração, as despesas gerais da Controladoria Geral de um Município poderiam ser congregadas na subfunção relativa a:","options":["a)  administração de receitas;","b)  controle administrativo;","c)  controle externo;","d)  controle interno;","e)  defesa do interesse público."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA Controladoria Geral de um Município é responsável pelo sistema de controle interno do Poder Executivo municipal.\n\nAssim, suas despesas gerais podem ser classificadas:\n• função: Administração;\n• subfunção: Controle Interno.\n\nControle externo é exercido, em regra, pelo Poder Legislativo com o auxílio do Tribunal de Contas, não pela Controladoria municipal."},{"bank":"FGV - TCI (CGM RJ)/Pref RJ/2023","num":"87","stem":"Um analista de controle precisou fazer uma análise comparativa da alocação dos recursos de um ente público abrangendo dois mandatos de um mesmo gestor a fim de identificar as unidades orçamentárias priorizadas no processo alocativo.<br><br>\n\nComo o analista deseja identificar os responsáveis pelas decisões em termos de recursos aplicados, deve usar como base a classificação:","options":["a)  funcional;","b)  institucional;","c)  por natureza;","d)  programática;","e)  por modalidade de aplicação."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA classificação institucional identifica:\n• os órgãos orçamentários;\n• as unidades orçamentárias;\n• os responsáveis pela execução das dotações.\n\nComo o analista pretende verificar quais unidades foram priorizadas e quem respondeu pelas decisões de alocação, deve utilizar a classificação institucional.\n\nA classificação funcional mostra a área de atuação, enquanto a programática evidencia os programas e ações."},{"bank":"FGV - ATR (AGENERSA)/AGENERSA/2023","num":"88","stem":"Assinale a opção que indica a categoria econômica em que estão classificadas as despesas que não contribuem, diretamente, para a formação ou a aquisição de bens de capital.","options":["a) De capital.","b) Diretas.","c)  Indiretas.","d) Correntes.","e) Operacionais."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs despesas que não contribuem diretamente para a formação ou aquisição de bens de capital são classificadas como despesas correntes.\n\nElas abrangem, entre outros:\n• pessoal e encargos sociais;\n• juros e encargos da dívida;\n• outras despesas correntes.\n\nAs despesas de capital, por sua vez, abrangem investimentos, inversões financeiras e amortização da dívida."},{"bank":"FGV - Ana (Pref Niterói)/Pref Niterói/Contábil/2023","num":"89","stem":"Com o objetivo de promover capacitação de professores da rede estadual em cursos de pós-graduação stricto sensu, o governo de um ente estadual lançou o programa “Professores Mestres e Doutores”. O programa prevê a celebração de convênios e concessão de bolsas por um período de quatro anos e tem como produto o aumento percentual de professores qualificados e, como medida de impacto, espera-se maior qualidade na formação dos alunos atendidos pela rede estadual.<br><br>\n\nÀ luz das categorias de classificação legalmente previstas para a despesa pública, tal programação de despesa","options":["a)  atende aos critérios de classificação como atividade, pois gera produto para a manutenção da ação governamental;","b) deve ser obrigatoriamente custeada com receitas vinculadas para aplicação na área de educação;","c)  em termos de modalidade de aplicação, pode ser tratada como uma transferência ou aplicação direta;","d)  na estrutura programática se enquadra como um projeto, cujo produto concorre para aperfeiçoar a ação pública;","e) sob a perspectiva na categoria econômica do gasto, deve ser classificada como um investimento."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nO projeto é um instrumento de programação com duração limitada, destinado à expansão ou ao aperfeiçoamento da ação governamental.\n\nNo caso:\n• existe prazo determinado de quatro anos;\n• há um produto específico: aumento do percentual de professores qualificados;\n• pretende-se aperfeiçoar a política pública educacional.\n\nPor isso, a programação se enquadra como projeto.\n\nAtividades são contínuas e permanentes. Além disso, a capacitação não é necessariamente classificada como investimento apenas por aperfeiçoar a ação governamental."},{"bank":"FGV - AJ (TJ RN)/TJ RN/Administrativa/Contabilidade/2023","num":"90","stem":"Em um Município há uma praça pública onde estão instalados alguns bancos, aparelhos de ginástica ao ar livre e três quiosques utilizados por permissionários. O equipamento é administrado pela Prefeitura Municipal. A fim de incentivar os artesãos e empreendedores locais, a Prefeitura lançou um projeto para a promoção de feiras nos finais de semana. Entre outras ações, a Prefeitura contratou a locação de tendas para os expositores.<br><br>\n\nEssa contratação deve ser tratada como:","options":["a)  ativo imobilizado, pois envolve a instalação das tendas na praça pública;","b)  despesas de natureza extraordinária abertas por créditos adicionais;","c)  obras e instalações, com custos cobertos pelos expositores;","d)  serviço de terceiros, pois não há ampliação dos benefícios econômicos associados ao equipamento público;","e)  variação patrimonial com impacto qualitativo no patrimônio do Município."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA Prefeitura contratou a locação de tendas. A locação representa prestação de serviço por terceiro.\n\nNão há aquisição das tendas nem incorporação de novo bem ao patrimônio público.\n\nTambém não ocorre ampliação dos benefícios econômicos ou do potencial de serviços da praça de forma permanente.\n\nAssim, o gasto deve ser tratado como serviço de terceiros, com reconhecimento de despesa orçamentária corrente e variação patrimonial diminutiva."}]},{"id":10,"start":91,"end":100,"questions":[{"bank":"FGV - AJ (TJ RN)/TJ RN/Administrativa/Contabilidade/2023","num":"91","stem":"O orçamento de um dado ente federativo dava autorização para o início de um programa de manutenção e expansão das instalações físicas da rede pública de educação básica.<br><br>\n\nÀ luz das orientações do Manual Técnico de Orçamento (MTO), para a classificação programática da despesa:","options":["a)  todas as ações do programa serão classificadas como um projeto;","b)  se parte das ações do projeto forem custeadas com recursos de operações de crédito, será uma operação especial;","c)  por se tratar de um programa autorizado na lei orçamentária do ente, os recursos do tesouro são a única fonte;","d)  não é permitida a existência de um mesmo projeto em mais de uma esfera orçamentária ou em programas diferentes;","e)  os recursos serão destinados às ações do programa na modalidade aplicação direta."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nDe acordo com o Manual Técnico de Orçamento, um mesmo projeto não pode integrar mais de uma esfera orçamentária nem aparecer em programas diferentes.\n\nIsso preserva a coerência da programação e evita duplicidade de registro.\n\nAs demais alternativas estão incorretas porque:\n• um programa pode conter projetos, atividades e operações especiais;\n• o uso de operação de crédito não transforma a ação em operação especial;\n• podem existir diferentes fontes de recursos;\n• a modalidade de aplicação depende da forma como o recurso será executado."},{"bank":"FGV - Tec (DPE RS)/DPE RS/Administrativa/2023","num":"92","stem":"Em uma entidade pública os servidores do setor de contabilidade estavam analisando a classificação da categoria econômica de algumas despesas em decorrência de um erro apontado pelo órgão de controle no período anterior.<br><br>\n\nAo final da discussão, eles chegaram ao consenso de que o item que, pelas suas características e impacto no patrimônio do ente, NÃO pode ser classificado como despesa corrente refere-se a:","options":["a)  serviços de manutenção predial;","b)  amortização do principal da dívida contratual;","c)  aquisição de material para distribuição gratuita;","d)  remuneração de servidores em cargos comissionados;","e)  pagamento de juros e encargos de empréstimos por antecipação da receita."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA amortização do principal da dívida é classificada como despesa de capital.\n\nEla reduz o passivo do ente público e integra o grupo Amortização da Dívida.\n\nAs demais opções são despesas correntes:\n• manutenção predial: outras despesas correntes;\n• material para distribuição gratuita: outras despesas correntes;\n• remuneração de servidores: pessoal e encargos sociais;\n• juros e encargos: juros e encargos da dívida."},{"bank":"FGV - Ana (DPE RS)/DPE RS/Apoio Especializado/Contabilidade/2023","num":"93","stem":"Um servidor recém-empossado em um órgão público foi lotado no setor de contabilidade do órgão. Diante da necessidade de registrar uma despesa relativa a serviços de reparos na rede hidráulica e na pintura de um dos andares do prédio onde funciona o órgão, o servidor novo consultou colegas mais antigos quanto à classificação apropriada do elemento de despesa. A despesa foi executada a partir de um aditivo contratual com a empresa Gov Manutenções Prediais Ltda.<br><br>\n\nUm servidor mais experiente o orientou no sentido de que a referida despesa deveria ser classificada como:","options":["a)  36 - Outros Serviços de Terceiros, no grupo inversões financeiras, pela aplicação em bens já em utilização;","b)  37 - Locação de Mão de Obra, por se tratar de serviço prestado a partir de contrato de terceirização;","c)  39 - Outros serviços de terceiros - Pessoa Jurídica;","d)  51 - Obras e instalações, uma vez que o valor gasto será incorporado ao valor do imóvel;","e)  52 - Equipamentos e Material Permanente, pois o valor gasto aumenta os benefícios econômicos do imóvel usado."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nOs reparos na rede hidráulica e a pintura possuem natureza de manutenção predial.\n\nComo o serviço foi prestado por pessoa jurídica, o elemento adequado é:\n\n• 39 — Outros Serviços de Terceiros — Pessoa Jurídica.\n\nNão se trata de obra ou instalação, pois não houve ampliação ou transformação relevante do imóvel.\n\nTambém não é locação de mão de obra, aquisição de equipamento ou inversão financeira."},{"bank":"FGV - APO (Pref RJ)/Pref RJ/2023","num":"94","stem":"No Plano Plurianual 2022-2025 do Município do Rio de Janeiro, aprovado pela Lei nº 7.234, de 12 de janeiro de 2022, consta o programa estratégico 0643 - Resiliência e Gestão de Risco. Pela lógica do processo orçamentário brasileiro, esse programa terá suas ações desdobradas em orçamentos anuais ao longo do período a que se refere.<br><br>\n\nA classificação da despesa pública por programas tem a finalidade de responder perguntas do tipo:","options":["a)  De onde virão os recursos para realizar a despesa?","b)  Em que áreas de despesa a ação governamental será realizada?","c)  O que se pretende alcançar com a implementação da política pública?","d)  Qual o efeito econômico da realização da despesa?","e)  Quem é o responsável pelo gasto?"],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA classificação programática organiza a atuação governamental em programas e ações.\n\nO programa responde à pergunta:\n“O que se pretende alcançar com a implementação da política pública?”\n\nAs demais perguntas correspondem a outros classificadores:\n• origem dos recursos: fonte de recursos;\n• área de atuação: classificação funcional;\n• efeito econômico: natureza da despesa;\n• responsável pelo gasto: classificação institucional."},{"bank":"FGV - APO (Pref RJ)/Pref RJ/2023","num":"95","stem":"No segundo ano do seu mandato, conforme compromisso assumido em sua plataforma de campanha, o governador de um Estado da federação obteve aprovação legislativa para a criação de uma empresa pública para promoção do turismo no território do Estado, que conta com grande riqueza natural e cultural.<br><br>\n\nOs gastos necessários para a criação da referida empresa, incluindo a constituição do seu capital, devem ser classificados no grupo de natureza da despesa:","options":["a)  investimentos;","b)  inversões financeiras;","c)  transferências de capital;","d)  transferências intragovernamentais;","e)  transferências setoriais."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA constituição ou o aumento do capital de empresas públicas integra o grupo Inversões Financeiras.\n\nEsse grupo inclui, entre outros:\n• aquisição de imóveis já em utilização;\n• aquisição de títulos representativos do capital de empresas;\n• constituição ou aumento do capital de entidades.\n\nPortanto, os gastos para criação da empresa pública, inclusive a integralização do capital, são inversões financeiras."},{"bank":"FGV - APO (Pref RJ)/Pref RJ/2023","num":"96","stem":"No processo de elaboração da proposta orçamentária de cada exercício, é imprescindível a definição dos programas, que consistem em instrumentos de organização da ação governamental visando à concretização dos objetivos pretendidos.<br><br>\n\nNos termos da Portaria Ministerial nº 42, 14/04/1999, os programas devem:","options":["a)  considerar o maior nível de agregação das áreas de despesa que competem ao setor público;","b)  obedecer a estrutura programática comum e consistente, que assegure uniformidade das ações ao longo do tempo;","c)  ser classificados como operações especiais se forem financiados por receitas de capital;","d)  ser estruturados a partir das categorias definidas na LDO do período de referência;","e)  ter seus objetivos mensurados por indicadores estabelecidos no PPA."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nSegundo a Portaria nº 42/1999, o programa é o instrumento de organização da ação governamental voltado à concretização dos objetivos pretendidos.\n\nEsses objetivos devem ser mensurados por indicadores estabelecidos no Plano Plurianual.\n\nOs indicadores permitem acompanhar:\n• resultados;\n• evolução do problema enfrentado;\n• efetividade da política pública.\n\nAs demais alternativas não correspondem à definição normativa dos programas."},{"bank":"FGV - APO (Pref RJ)/Pref RJ/2023","num":"97","stem":"Em geral são considerados como despesa pública todos os dispêndios realizados por um ente governamental no provimento de bens e serviços públicos, diretos ou indiretos. Porém, nem todos esses dispêndios têm impacto efetivo no patrimônio do ente.<br><br>\n\nPara que uma despesa seja considerada efetiva, é necessário que:","options":["a)  seja autorizada na lei orçamentária anual;","b)  sua liquidação se dê no curso do exercício financeiro;","c)  sua realização reduza a situação líquida patrimonial do ente;","d)  tenha impacto efetivo na apuração do resultado primário;","e)  tenha sido regular e previamente empenhada."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nDespesa orçamentária efetiva é aquela cuja realização reduz a situação líquida patrimonial do ente.\n\nEla provoca uma variação patrimonial diminutiva sem que ocorra, simultaneamente, a incorporação de um ativo ou a redução de um passivo de valor equivalente.\n\nExemplos:\n• pagamento de pessoal;\n• consumo de materiais;\n• contratação de serviços.\n\nA simples autorização, o empenho ou a liquidação não determinam, isoladamente, se a despesa é efetiva."},{"bank":"FGV - APO (Pref RJ)/Pref RJ/2023","num":"98","stem":"Na elaboração, em 2022, do projeto de lei orçamentária anual (LOA) do Município Alfa para o ano de 2023, foi inserida dotação destinada à aquisição de terreno onde seria executada, em cronograma de obra de dez meses de duração, no próprio ano de 2023, a construção de uma pequena creche municipal.<br><br>\n\nSegundo a Lei nº 4.320/1964, tal dotação para aquisição desse imóvel é classificada como:","options":["a)  inversão financeira;","b)  transferência de capital;","c)  despesa de custeio;","d)  transferência corrente;","e)  investimento."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nA aquisição do terreno está diretamente vinculada à execução de uma obra pública: a construção da creche.\n\nSegundo a Lei nº 4.320/1964, a aquisição de imóvel necessário à realização de obra integra o grupo Investimentos.\n\nSe o imóvel fosse adquirido sem vinculação a obra específica, a classificação poderia ser inversão financeira.\n\nComo o terreno será usado na construção da creche, a classificação correta é investimento."},{"bank":"FGV - FR (Pref RJ)/Pref RJ/2023","num":"99","stem":"Um Município iniciou um projeto de requalificação de suas áreas urbanas, parte por investimentos próprios e parte em regime de concessão à iniciativa privada.<br><br>\n\nHá uma série de externalidades geradas por programas dessa natureza, e a classificação da despesa pública indica o efeito econômico da aplicação desses recursos por meio da análise das categorias que envolvem:","options":["a)  a descrição dos objetos do gasto;","b)  o detalhamento dos grupos de natureza de despesa;","c)  as fontes de recursos para custeio do programa;","d)  a forma de aplicação dos recursos;","e)  os montantes de despesas correntes e de capital."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nO efeito econômico da despesa é analisado principalmente por meio das categorias econômicas:\n\n• despesas correntes;\n• despesas de capital.\n\nAs despesas correntes estão ligadas à manutenção das atividades públicas.\n\nAs despesas de capital relacionam-se à formação ou aquisição de bens de capital e à amortização da dívida.\n\nAssim, a análise dos montantes correntes e de capital permite avaliar o efeito econômico da aplicação dos recursos."},{"bank":"FGV - TecGes Admin (ALEMA)/ALEMA/Contador/Finanças Públicas/2023","num":"100","stem":"Em uma entidade do setor público, as despesas orçamentárias com o pagamento de diárias, auxílio-alimentação e auxílio-transporte são classificadas como","options":["a)  Investimentos.","b)  Inversões Financeiras.","c)  Pessoal e Encargos Sociais.","d)  Outras Despesas Correntes.","e)  Auxílios para Inversões Financeiras."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nDiárias, auxílio-alimentação e auxílio-transporte são classificados no grupo Outras Despesas Correntes.\n\nEsses gastos:\n• não formam nem adquirem bens de capital;\n• não representam amortização da dívida;\n• não integram o grupo Pessoal e Encargos Sociais, embora sejam pagos a servidores.\n\nPortanto, pertencem à categoria econômica Despesas Correntes e ao grupo Outras Despesas Correntes."}]},{"id":11,"start":101,"end":110,"questions":[{"bank":"FGV - TecGes Admin (ALEMA)/ALEMA/Controlador/2023","num":"101","stem":"Nas despesas de uma entidade do setor público, em “Pessoal e Encargos Sociais” estão as Obrigações Patronais.<br><br>Esse item contém as despesas orçamentárias com encargos que a administração tem por sua condição de empregadora, e resultantes de pagamento de pessoal, tais como","options":["a)  Licença para Tratamento de Saúde.","b)  Vencimento ou Salário de Cargos de Confiança.","c)  Gratificação pela Chefia ou Coordenação de Curso de Área ou Equivalente.","d)  Fundo de Garantia por Tempo de Serviço e contribuições para Institutos de Previdência.","e)  Cobertura de alimentação, pousada e locomoção urbana do servidor que se desloca de sua sede."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs obrigações patronais são encargos suportados pela Administração Pública em sua condição de empregadora.\n\nEntre elas estão:\n• contribuições patronais para regimes de previdência;\n• Fundo de Garantia do Tempo de Serviço, quando aplicável;\n• outros encargos incidentes sobre a folha de pagamento.\n\nVencimentos, salários e gratificações são despesas com remuneração. Diárias cobrem alimentação, pousada e locomoção do servidor em deslocamento."},{"bank":"FGV - TecGes Admin (ALEMA)/ALEMA/Controlador/2023","num":"102","stem":"De acordo com o MCASP, no processo de aquisição de bens ou serviços por parte do ente da Federação, é necessário observar alguns passos para que se possa proceder à adequada classificação quanto à natureza de despesa orçamentária e garantir que a informação contábil seja fidedigna.<br><br>Assinale a opção que apresenta um exemplo de despesa de natureza orçamentária.","options":["a)  Devolução dos valores de terceiros, como cauções e depósitos.","b)  Pagamento das operações de crédito por antecipação de receita orçamentária.","c)  Pagamentos de Salário-Família, Salário-Maternidade e Auxílio-Natalidade.","d)  Contratação de bens e serviços para realização de determinação ação, como serviços de terceiros.","e)  Recolhimento de consignações e retenções, anteriormente retidos na folha de salários de pessoal ou nos pagamentos de serviços de terceiros."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nDespesa orçamentária é aquela que depende de autorização legislativa e de dotação orçamentária para ser realizada.\n\nA contratação de bens e serviços, como serviços de terceiros, exige empenho e execução orçamentária.\n\nAs demais alternativas representam, em regra, dispêndios extraorçamentários, como devolução de depósitos, recolhimento de consignações e pagamento de operação de crédito por antecipação de receita."},{"bank":"FGV - AFCE (TCE-BA)/TCE BA/2023","num":"103","stem":"Na classificação consolidada das despesas por função de um Estado da federação, as despesas para custeio e manutenção das atividades e competências legais do Tribunal de Contas do Estado deverão ser enquadradas, respectivamente, nas seguintes função e subfunção:","options":["a)  01 – Legislativa; 031 – Ação Legislativa;","b)  01 – Legislativa; 032 – Controle Externo;","c)  28 – Encargos Especiais; 124 – Controle Interno;","d)  04 – Administração; 062 – Defesa do Interesse Público;","e)  04 – Administração; 125 – Normatização e Fiscalização."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nOs Tribunais de Contas exercem atividades de controle externo em auxílio ao Poder Legislativo.\n\nAssim, a classificação funcional adequada é:\n• Função 01 – Legislativa;\n• Subfunção 032 – Controle Externo.\n\nA subfunção Controle Interno é utilizada para órgãos que integram o sistema de controle interno de cada Poder."},{"bank":"FGV - AL (CAM DEP)/CAM DEP/Processo Legislativo e Gestão/2023","num":"104","stem":"Despesa orçamentária é toda operação que requer, para ser concretizada, autorização legislativa na forma de alocação de dotação orçamentária.<br><br>Sobre a classificação da despesa orçamentária, assinale a afirmativa correta.","options":["a)  A função é representada pelos três primeiros dígitos da classificação funcional e representa o maior nível de agregação das diversas áreas de atuação do setor público.","b)  A subfunção, indicada pelos dois últimos dígitos da classificação funcional, representa um nível de agregação imediatamente inferior ao da função.","c)  A atividade é um instrumento de programação utilizado para alcançar o objetivo de um programa, das quais resulta um produto que concorre para a expansão ou o aperfeiçoamento da ação de Governo.","d)  O projeto é um instrumento de programação utilizado para alcançar o objetivo de um programa, das quais resulta um produto necessário à manutenção da ação de Governo.","e)  As operações especiais compreendem despesas que não contribuem para a manutenção, expansão ou aperfeiçoamento das ações de governo, das quais não resulta um produto, e não gera contraprestação direta sob a forma de bens ou serviços."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nOperações especiais são despesas que:\n• não contribuem para a manutenção, expansão ou aperfeiçoamento das ações governamentais;\n• não geram produto;\n• não produzem contraprestação direta em bens ou serviços.\n\nA função é identificada pelos dois primeiros dígitos, e a subfunção pelos três últimos.\n\nProjeto tem duração limitada e busca expansão ou aperfeiçoamento. Atividade é contínua e permanente, destinada à manutenção da ação governamental."},{"bank":"FGV - AL (CAM DEP)/CAM DEP/Processo Legislativo e Gestão/2023","num":"105","stem":"O conjunto de informações que constitui a natureza de despesa orçamentária forma um código estruturado que agrega a categoria econômica, o grupo, a modalidade de aplicação e o elemento.<br><br>Com relação à estrutura da natureza da despesa orçamentária, analise as afirmativas a seguir.<br><br>I. A estrutura da natureza da despesa a ser observada na execução orçamentária de todas as esferas de governo será \"c.gg.m.ee.dd\".<br><br>II. O código da natureza de despesa orçamentária é composto por seis dígitos, desdobrado até o nível de elemento ou, opcionalmente, por oito, contemplando o desdobramento facultativo do elemento.<br><br>III. A classificação da Reserva de Contingência, identificada com o código \"9.9.99.99.99\", é passível de execução, servindo de fonte para abertura de créditos adicionais.<br><br>Está correto o que se afirma em","options":["a)  II, apenas.","b)  I e II, apenas.","c)  I e III, apenas.","d)  II e III, apenas.","e)  I, II e III."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA afirmativa II está correta: o código pode ser apresentado com seis dígitos até o elemento ou com oito dígitos, incluindo o desdobramento facultativo.\n\nA afirmativa I está incorreta porque a estrutura correta utiliza um dígito para categoria econômica, um para grupo, dois para modalidade, dois para elemento e, facultativamente, dois para desdobramento.\n\nA afirmativa III está incorreta porque a Reserva de Contingência não é executada diretamente. Ela serve como fonte para abertura de créditos adicionais."},{"bank":"FGV - AL (CAM DEP)/CAM DEP/Contador/2023","num":"106","stem":"Despesa orçamentária é toda transação que depende de autorização legislativa, na forma de consignação de dotação orçamentária, para ser efetivada.<br><br>Em relação ao tema, relacione os conceitos a seguir às respectivas definições.<br><br>1. Função<br><br>2. Subfunção<br><br>3. Atividade<br><br>4. Projeto<br><br>( ) dois primeiros dígitos da classificação funcional e maior nível de agregação das diversas áreas de atuação do setor público.<br><br>( ) envolve um conjunto de operações, limitadas no tempo, das quais resulta um produto que concorre para a expansão ou o aperfeiçoamento da ação governamental.<br><br>( ) três últimos dígitos da classificação funcional, evidencia cada área da atuação governamental.<br><br>( ) envolve um conjunto de operações, de modo contínuo e permanente, das quais resulta um produto necessário à manutenção da ação governamental.<br><br>Assinale a opção que indica a relação correta, na ordem apresentada.","options":["a)  1 – 3 – 2 – 4.","b)  1 – 4 – 2 – 3.","c)  4 – 2 – 3 – 1.","d)  2 – 4 – 3 – 1.","e)  4 – 3 – 2 – 1."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA sequência correta é:\n• Função (1): dois primeiros dígitos e maior nível de agregação;\n• Projeto (4): operações limitadas no tempo, voltadas à expansão ou aperfeiçoamento;\n• Subfunção (2): três últimos dígitos e área específica de atuação;\n• Atividade (3): operações contínuas e permanentes, voltadas à manutenção.\n\nLogo, a ordem é 1 – 4 – 2 – 3."},{"bank":"FGV - AL (CAM DEP)/CAM DEP/Contador/2023","num":"107","stem":"O Grupo de Natureza de Despesa (GND) é um agregador de elementos de despesa orçamentária com as mesmas características quanto ao objeto de gasto.<br><br>Com relação ao GND, avalie se as afirmativas a seguir são verdadeiras (V) ou falsas (F).<br><br>( ) O GND 3 representa “Outras Despesas Correntes”, despesas orçamentárias com aquisição de material de consumo, pagamento de diárias, contribuições, subvenções, auxílio-alimentação, auxílio-transporte, além de outras despesas da categoria econômica \"Despesas Correntes\" não classificáveis nos demais grupos de natureza de despesa.<br><br>( ) O GND 4 representa “Investimentos”, despesas orçamentárias com softwares e com o planejamento e a execução de obras, inclusive com a aquisição de imóveis considerados necessários à realização destas últimas, e com a aquisição de instalações, equipamentos e material permanente; incluem-se também neste grupo as despesas necessárias à realização de programas especiais de trabalho, custeadas com recursos de operações de crédito.<br><br>( ) O GND 6 representa “Inversões Financeiras”, despesas orçamentárias com a aquisição de imóveis ou bens de capital já em utilização; aquisição de títulos representativos do capital de empresas ou entidades de qualquer espécie, já constituídas, quando a operação não importe aumento do capital; e com a constituição ou aumento do capital de empresas, além de outras despesas classificáveis neste grupo.<br><br>As afirmativas são, respectivamente,","options":["a)  F – V – F.","b)  F – V – V.","c)  V – V – V.","d)  V – F – F.","e)  F – F – V."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nPrimeira afirmativa: verdadeira.\nO GND 3 corresponde a Outras Despesas Correntes.\n\nSegunda afirmativa: falsa.\nEmbora o GND 4 corresponda a Investimentos, a inclusão genérica de programas especiais custeados com operações de crédito torna a afirmação incorreta.\n\nTerceira afirmativa: falsa.\nInversões Financeiras correspondem ao GND 5, e não ao GND 6. O GND 6 é Amortização da Dívida.\n\nLogo, a sequência é V – F – F."},{"bank":"FGV - AL (CAM DEP)/CAM DEP/Contador/2023","num":"108","stem":"O Elemento de Despesa Orçamentária tem por finalidade identificar os objetos de gasto, tais como vencimentos e vantagens fixas, juros, diárias, material de consumo, serviços de terceiros prestados sob qualquer forma, subvenções sociais, obras e instalações, equipamentos e material permanente, auxílios, amortização e outros que a administração pública utiliza para a consecução de seus fins.<br><br>Relacione os elementos de despesa a seguir aos respectivos exemplos.<br><br>1. Vencimentos e Vantagens Fixas – Pessoal Civil<br><br>2. Material de Consumo<br><br>3. Diárias – Civil<br><br>4. Equipamentos e Material Permanente<br><br>( ) Suprimento de aviação.<br><br>( ) Aparelhos de medição.<br><br>( ) Cobertura de alimentação, pousada e locomoção urbana do servidor público estatutário ou celetista que se desloca de sua sede em objeto de serviço, em caráter eventual ou transitório.<br><br>( ) Retribuição Básica.<br><br>Assinale a opção que indica a relação correta na ordem apresentada.","options":["a)  1 – 3 – 2 – 4.","b)  1 – 4 – 2 – 3.","c)  4 – 2 – 3 – 1.","d)  2 – 4 – 3 – 1.","e)  4 – 3 – 2 – 1."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA relação correta é:\n• Suprimento de aviação: Material de Consumo (2);\n• Aparelhos de medição: Equipamentos e Material Permanente (4);\n• Alimentação, pousada e locomoção em deslocamento eventual: Diárias – Civil (3);\n• Retribuição Básica: Vencimentos e Vantagens Fixas – Pessoal Civil (1).\n\nPortanto, a sequência é 2 – 4 – 3 – 1."},{"bank":"FGV - AJ (TJ SE)/TJ SE/Contabilidade/2023","num":"109","stem":"Um ente estadual recebeu recursos decorrentes de uma emenda parlamentar ao orçamento federal, na modalidade transferência com finalidade definida. A classificação programática da ação orçamentária a ser custeada com os recursos da emenda era iniciada com o dígito 1, o que significa que a ação orçamentária:","options":["a)  está alocando recursos a uma despesa de caráter continuado;","b)  não acarretará impacto na apuração do resultado primário;","c)  se refere a um projeto, envolvendo um conjunto de operações limitadas no tempo;","d)  será coberta com recursos a serem deduzidos na apuração da receita corrente líquida;","e)  tem como fonte de custeio recursos diretamente arrecadados."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nNa identificação das ações orçamentárias:\n• códigos iniciados por 1, 3, 5 ou 7 indicam projetos;\n• códigos iniciados por 2, 4, 6 ou 8 indicam atividades;\n• códigos iniciados por 0 indicam operações especiais.\n\nProjeto é um conjunto de operações limitado no tempo, do qual resulta produto que contribui para a expansão ou aperfeiçoamento da ação governamental."},{"bank":"FGV - AL (CAM DEP)/CAM DEP/Consultor de Orçamento e Fiscalização Financeira/2023","num":"110","stem":"Observe as assertivas a seguir:<br><br>I. Trata-se de gastos do governo decorrentes de imposição firmada na Constituição Federal;<br><br>II. Obvia-se ser um dispêndio havido na concessão de um empréstimo tomado pelo governo em favor de outra instituição ou pessoa.<br><br>III. Refere-se a parcela dos recursos públicos livre para utilização . em ações governamentais;<br><br>IV. São gastos necessários para a manutenção da estrutura do Estado;<br><br>As assertivas I, II, III e IV correspondem, respectivamente, às seguintes naturezas da despesa pública:","options":["a)  obrigatória/financeira/discricionária/primária .","b)  primária/discricionária/financeira/ obrigatória.","c)  primária/obrigatória/discricionária/financeira.","d)  obrigatória/primária/discricionária/financeira.","e)  primária/financeira/discricionária/obrigatória."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nI. Gasto decorrente de imposição constitucional: despesa obrigatória.\n\nII. Concessão de empréstimo pelo governo: despesa financeira.\n\nIII. Parcela de recursos livre para utilização em ações governamentais: despesa discricionária.\n\nIV. Gastos necessários à manutenção da estrutura do Estado: despesa primária.\n\nLogo, a sequência correta é: obrigatória / financeira / discricionária / primária."}]},{"id":12,"start":111,"end":120,"questions":[{"bank":"FGV - ADTND (AMAZUL)/AMAZUL/Auditor/2026","num":"111","stem":"A realização da despesa pública envolve fases encadeadas, disciplinadas pela Lei nº 4.320/1964, que definem a forma como o gasto é registrado, verificado e autorizado para pagamento. Esse processo garante que o Estado somente efetue despesas após constituir obrigação válida, comprovar o direito do credor e autorizar o pagamento por autoridade competente.<br><br>\n\nConsiderando os estágios da despesa previstos na legislação financeira, assinale a opção que descreve corretamente a fase de liquidação.","options":["a)  Ato que autoriza o pagamento da despesa e determina sua quitação perante a tesouraria.","b)  Verificação prévia sobre a necessidade de licitação como condição para iniciar a despesa.","c)  Registro contábil que cria obrigação de pagamento, limitado ao crédito orçamentário disponível.","d)  Procedimento excepcional que permite o fornecimento de numerário ao servidor para despesas urgentes.","e)  Verificação do direito adquirido pelo credor com base nos títulos e documentos comprobatórios da despesa."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nA liquidação é o estágio em que a Administração verifica o direito adquirido pelo credor.\n\nEssa verificação é realizada com base:\n• no contrato, ajuste ou acordo;\n• na nota de empenho;\n• nos comprovantes de entrega do material ou da prestação do serviço;\n• nos demais documentos comprobatórios.\n\nA liquidação confirma:\n• a origem e o objeto do que deve ser pago;\n• o valor exato;\n• quem é o credor.\n\nA alternativa A descreve a ordem de pagamento. A alternativa C descreve o empenho."},{"bank":"FGV - TDTND/AMAZUL/Assistente Administrativo/2026","num":"112","stem":"De acordo com a Lei no 4.320/1964, um dos estágios da despesa orçamentária é o empenho que consiste na vinculação de recursos orçamentários a uma finalidade determinada.<br><br>\n\nO tipo de empenho que é utilizado para despesas sujeitas a parcelamentos, como aluguéis, prestação de serviços e salários denomina-se","options":["a)  global.","b)  ordinário.","c)  estimativo.","d)  suplementar.","e)  extraordinário."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nO empenho global é utilizado para despesas contratuais ou outras despesas sujeitas a parcelamento.\n\nExemplos:\n• aluguéis;\n• contratos de prestação de serviços;\n• salários;\n• contratos de execução continuada.\n\nO valor total da obrigação é empenhado, embora a liquidação e o pagamento ocorram em parcelas.\n\nO empenho ordinário é usado quando o valor é conhecido e o pagamento ocorre de uma só vez. O estimativo é aplicado quando não se pode determinar previamente o valor exato da despesa."},{"bank":"FGV - Esp Leg (ALERJ)/ALERJ/Nível IV/Controle Interno e Auditoria/2026","num":"113","stem":"A despesa pública orçamentária é processada por meio de estágios sucessivos e organizada por diversas classificações para fins de controle, transparência e consolidação das contas nacionais.<br><br>\n\nSobre os estágios de execução e as classificações da despesa, assinale a afirmativa correta.","options":["a)  O estágio da liquidação caracteriza-se pela entrega de numerário ao credor mediante ordem bancária, sendo este o momento em que a despesa pública efetivamente “nasce” para o sistema contábil orçamentário.","b)  A despesa destinada à aquisição de um edifício já em utilização por terceiros, para a instalação de um novo hospital, classifica-se quanto à sua natureza econômica como Despesa de Capital, especificamente no grupo de Investimentos (GND 4).","c)  O empenho estimativo é a modalidade obrigatoriamente utilizada para despesas contratuais sujeitas a parcelamento, como obras de grande vulto, visando reservar a dotação total necessário para o exercício no início do cronograma.","d)  A classificação funcional é composta por funções e subfunções prefixadas e de aplicação obrigatória por todos os entes da Federação, permitindo a consolidação nacional dos gastos por área e subárea das políticas públicas, independentemente da estrutura de programas de cada ente.","e)  Segundo o princípio da especificação, a Lei de Orçamento deve discriminar a despesa, obrigatoriamente, até o nível de subelemento (item de gasto), sendo vedada a aprovação de créditos orçamentários apenas por categoria econômica e grupo de natureza de despesa."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA classificação funcional é formada por funções e subfunções padronizadas e obrigatórias para todos os entes da Federação.\n\nEssa padronização permite:\n• comparar os gastos entre diferentes entes;\n• consolidar nacionalmente as despesas;\n• identificar as áreas e subáreas de atuação governamental.\n\nA alternativa A descreve o pagamento, e não a liquidação.\n\nA aquisição de edifício já em utilização é, em regra, inversão financeira, e não investimento.\n\nDespesas contratuais parceladas utilizam empenho global, não estimativo.\n\nA discriminação obrigatória não exige detalhamento até o subelemento."},{"bank":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026","num":"114","stem":"Em uma entidade do setor público, verificou-se que o empenho, que havia sido formalizado, foi anulado parcialmente.<br><br>\n\nUm possível motivo para a anulação parcial do empenho é que","options":["a)  o objeto do contrato não foi cumprido.","b)  a nota de empenho foi emitida de modo incorreto.","c)  o valor do empenho excedia o montante da d
