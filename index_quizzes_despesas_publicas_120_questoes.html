<script>
const blocks=[{"id":1,"start":1,"end":10,"questions":[{"bank":"FGV - Ana CI (Pref Canaã Carajás)/Pref Canaã Carajás/2025","num":"1","stem":"Uma entidade do setor público realizou os seguintes pagamentos em relação a seus empregados em 2024:<br><br>Aposentadorias: R$400.000;<br>Salário-Família: R$360.000;<br>Pensões: R$320.000;<br>Salário-Maternidade: R$250.000;<br>Auxílio-Natalidade: R$210.000.<br><br>Assinale a opção que indica o montante que tem natureza extraorçamentária.","options":["a)  R$460.000","b)  R$610.000","c)  R$780.000","d)  R$820.000","e)  R$1.140.000"],"answer":"d","explanation":"A alternativa correta é D: R$ 820.000.\n\nA questão distingue os benefícios que integram o orçamento daqueles que possuem natureza extraorçamentária. No contexto apresentado, Salário-Família (R$ 360.000), Salário-Maternidade (R$ 250.000) e Auxílio-Natalidade (R$ 210.000) compõem o montante extraorçamentário.\n\nCálculo:\nR$ 360.000 + R$ 250.000 + R$ 210.000 = R$ 820.000.\n\nAposentadorias e pensões, no caso proposto, não entram nessa soma. Por isso, as alternativas A, B, C e E apresentam combinações ou totais incompatíveis com a classificação exigida."},{"bank":"FGV - CInt (Pref Caraguatatuba)/Pref Caraguatatuba/2024","num":"2","stem":"No processo de aquisição de bens ou serviços por parte do ente da Federação deve-se identificar se o registro do fato é de caráter orçamentário ou extraorçamentário.<br><br>Em relação a essa distinção, assinale a opção correta.","options":["a)  Extraorçamentário: derivam de emissão de empenho para suportar o contrato, como a contratação de serviços de terceiros.","b)  Extraorçamentário: representam desembolsos de recursos de terceiros em poder do ente público, como devolução de cauções.","c)  Orçamentário: constituem instrumento para alcançar os fins dos programas governamentais, como pagamentos de salário-maternidade.","d)  Orçamentário: provêm de recolhimento de Consignações e retenções, como recolhimentos de valores anteriormente retidos na folha de salários de pessoal.","e)  Orçamentário: necessitam de recurso público previsto para sua realização e devem ser autorizados pelo Poder Legislativo, como pagamento das operações de crédito por antecipação de receita orçamentária."],"answer":"b","explanation":"A alternativa correta é B.\n\nA despesa extraorçamentária corresponde, em regra, à saída de valores que não pertencem definitivamente ao ente público. São recursos de terceiros que estavam temporariamente sob sua guarda, como cauções, depósitos, consignações e outras retenções. A devolução de uma caução é exemplo típico.\n\nA alternativa A está errada porque a emissão de empenho caracteriza a execução de despesa orçamentária. A alternativa C utiliza exemplo que, no contexto da classificação cobrada, não sustenta a afirmação. A alternativa D está errada porque o recolhimento de consignações e retenções é extraorçamentário. A alternativa E também está errada, pois a quitação de operação de crédito por antecipação de receita orçamentária possui natureza extraorçamentária."},{"bank":"FGV - Ana (CVM)/CVM/Contabilidade Pública/2024","num":"3","stem":"As transações realizadas por entidades públicas envolvendo receitas e despesas têm naturezas e implicações diversas, que requerem mecanismos de controle adequados para possibilitar a subsequente prestação de contas. Nesse contexto, considere as transações a seguir.<br><br>- contratação de entidade integrante do Orçamento Fiscal e da Seguridade Social para prestação de serviços de treinamento;<br><br>- recolhimento de contribuições patronais ao RPPS;<br><br>- recolhimento de tributos do próprio ente por empresas estatais dependentes.<br><br>Tais transações são exemplos de:","options":["a)  despesas de caráter continuado;","b)  despesas de caráter discricionário;","c)  despesas por mutação patrimonial;","d)  transações com contraprestação;","e)  transações intraorçamentárias."],"answer":"e","explanation":"A alternativa correta é E: transações intraorçamentárias.\n\nAs operações intraorçamentárias ocorrem entre órgãos, fundos ou entidades integrantes dos Orçamentos Fiscal e da Seguridade Social do mesmo ente federativo. Sua identificação evita a dupla contagem na consolidação das contas públicas.\n\nOs três exemplos envolvem movimentações entre unidades pertencentes ao mesmo orçamento consolidado: contratação de outra entidade integrante do orçamento, contribuição patronal ao regime próprio e recolhimento de tributo do próprio ente por estatal dependente.\n\nAs demais alternativas descrevem características que não representam o elemento comum às três transações."},{"bank":"FGV - ADTND (AMAZUL)/AMAZUL/Analista de Administração/2026","num":"4","stem":"O orçamento-programa atua como interface entre o planejamento e condução prática das funções executivas das organizações, em que a administração dos recursos têm como objetivos tornar viáveis os resultados esperados.<br><br>Acerca desse assunto, o instrumento cujo propósito é colaborar na efetivação do produto final previsto em um programa, sendo peça básica das funções administrativas e gerenciais, é conhecido como","options":["a)  atividade.","b)  programa.","c)  especificação.","d)  subprograma.","e)  tarefa."],"answer":"a","explanation":"A alternativa correta é A: atividade.\n\nA atividade é um instrumento de programação utilizado para alcançar o objetivo de um programa. Envolve operações que se realizam de modo contínuo e permanente, das quais resulta um produto necessário à manutenção da ação governamental.\n\nO programa organiza ações destinadas à solução de um problema ou atendimento de uma necessidade. Subprograma e especificação não correspondem ao conceito pedido. A tarefa representa nível operacional mais específico, mas não é a peça básica de programação descrita no enunciado."},{"bank":"FGV - Ana Leg (ALEGO)/ALEGO/Analista de Controle Externo/Finanças e Controle/2026","num":"5","stem":"O Poder Executivo do Estado Gama realizou despesas na ordem de $ 5 (cinco) milhões com o planejamento de obras de infraestrutura que seriam responsáveis pela geração de milhares de empregos.<br><br>Para realização dessa obra, foi necessária a aquisição de imóveis privados, com um custo adicional de $ 12 (doze) milhões aos cofres estaduais.<br><br>Considerando os fatos narrados e as disposições da Lei no 4.320/64, estas despesas devem ser classificadas como:","options":["a)  Inversão financeira, em ambos os casos.","b)  Transferência de Capital, em ambos os casos.","c)  Subvenção Econômica, no caso da despesa com desapropriação.","d)  Despesas de custeio, no caso da despesa com desapropriação.","e)  Investimentos, em ambos os casos."],"answer":"e","explanation":"A alternativa correta é E: investimentos, em ambos os casos.\n\nNos termos da Lei nº 4.320/1964, classificam-se como investimentos as dotações destinadas ao planejamento e à execução de obras, inclusive os gastos com a aquisição de imóveis considerados necessários à realização dessas obras.\n\nAssim, tanto o planejamento da obra de infraestrutura quanto a aquisição dos imóveis indispensáveis à sua execução integram a categoria de investimentos.\n\nA aquisição isolada de imóvel já em utilização poderia ser tratada como inversão financeira, mas não é essa a situação narrada: os imóveis são necessários à realização da obra."},{"bank":"FGV - Ana Leg (ALEGO)/ALEGO/Analista de Controle Externo/Finanças e Controle/2026","num":"6","stem":"Uma Empresa Pública, responsável pela prestação de serviços postais, apresentou déficit orçamentário e financeiro, demandando recursos do tesouro para financiamento de despesas com manutenção de seus serviços.<br><br>Nesta hipótese, considerando as disposições da Lei no 4.320/64, as despesas do tesouro destinadas a cobertura do déficit de manutenção desta empresa pública são classificadas como:","options":["a)  Transferência de capital.","b)  Amortização da dívida pública.","c)  Serviços de terceiros.","d)  Subvenção econômica.","e)  Operações especiais."],"answer":"d","explanation":"A alternativa correta é D: subvenção econômica.\n\nA Lei nº 4.320/1964 classifica como subvenções econômicas as transferências destinadas à cobertura dos déficits de manutenção de empresas públicas ou privadas de caráter industrial, comercial, agrícola ou pastoril, conforme previsão legal.\n\nO caso informa expressamente que os recursos do Tesouro serão usados para cobrir déficit de manutenção da empresa pública. Esse é o núcleo do conceito de subvenção econômica.\n\nNão se trata de amortização de dívida, contratação de serviço de terceiro ou transferência destinada a investimento."},{"bank":"FGV - Esp Leg (ALERJ)/ALERJ/Nível IV/Orçamento e Finanças/2026","num":"7","stem":"O Município de Vista Alegre decidiu ampliar sua rede municipal de atendimento à saúde para cumprir as metas do seu Plano Plurianual (PPA).<br><br>Para o exercício de 2025, a Secretaria Municipal de Saúde planejou as seguintes operações:<br><br>I. Construção de uma nova Unidade de Pronto Atendimento (UPA) em um bairro periférico, com duração prevista de 10 meses para a conclusão da obra física;<br><br>II. Aquisição de medicamentos oncológicos que serão entregues gratuitamente à população cadastrada em programas de tratamento contínuo.<br><br>Considerando as normas de classificação da despesa pública, assinale a opção que apresenta a classificação correta das duas despesas, quanto à natureza econômica (Categoria, Grupo da Natureza da Despesa (GND) e Elemento) e quanto à classificação programática (Tipo de Ação), respectivamente.","options":["a)  I. Despesa de Capital, GND 5 (Inversões Financeiras), Elemento 51 (Obras e Instalações), Ação do tipo Atividade;\n\nII. Despesa Corrente, GND 3 (Outras Despesas Correntes), Elemento 30 (Material de Consumo), Ação do tipo Projeto.","b)  I. Despesa de Capital, GND 4 (Investimentos), Elemento 51 (Obras e Instalações), Ação do tipo Projeto;\n\nII. Despesa Corrente, GND 1 (Pessoal e Encargos), Elemento 32 (Material para Distribuição Gratuita), Ação do tipo Atividade.","c)  I. Despesa de Capital, GND 4 (Investimentos), Elemento 51 (Obras e Instalações), Ação do tipo Projeto;\n\nII. Despesa Corrente, GND 3 (Outras Despesas Correntes), Elemento 32 (Material, Bem ou Serviço para Distribuição Gratuita), Ação do tipo Atividade.","d)  I. Despesa de Capital, GND 4 (Investimentos), Elemento 61 (Aquisição de Imóveis), Ação do tipo Projeto;\n\nII. Despesa de Capital, GND 4 (Investimentos), Elemento 30 (Material de Consumo), Ação do tipo Atividade.","e)  I. Despesa Corrente, GND 3 (Outras Despesas Correntes), Elemento 51 (Obras e Instalações), Ação do tipo Atividade;\n\nII. Despesa Corrente, GND 3 (Outras Despesas Correntes), Elemento 32 (Material para Distribuição Gratuita), Ação do tipo Projeto."],"answer":"c","explanation":"A alternativa correta é C.\n\nOperação I — construção da UPA:\n• Categoria econômica: Despesa de Capital;\n• GND 4: Investimentos;\n• Elemento 51: Obras e Instalações;\n• Tipo de ação: Projeto, pois é uma operação limitada no tempo e gera um produto que amplia a ação governamental.\n\nOperação II — medicamentos distribuídos gratuitamente:\n• Categoria econômica: Despesa Corrente;\n• GND 3: Outras Despesas Correntes;\n• Elemento 32: Material, Bem ou Serviço para Distribuição Gratuita;\n• Tipo de ação: Atividade, pois integra programa contínuo de tratamento.\n\nAs demais alternativas trocam GND, elemento ou tipo de ação."},{"bank":"FGV - Ana Leg (ALERO)/ALERO/Administrativa/2026","num":"8","stem":"Ao analisar uma dotação na Lei Orçamentária Anual (LOA), o servidor identificou que a despesa está vinculada a: (i) um órgão/unidade orçamentária responsável pela execução e (ii) uma área de atuação governamental associada à Educação, Ensino Fundamental.<br><br>Considerando as diferentes classificações orçamentárias, assinale a afirmativa correta.","options":["a)  A identificação do órgão e da unidade orçamentária corresponde à classificação funcional, enquanto a identificação da área de atuação governamental corresponde à classificação programática.","b)  Órgão e unidade orçamentária correspondem à classificação econômica, enquanto a área de atuação governamental corresponde à classificação programática.","c)  Órgão e unidade orçamentária correspondem à classificação programática, enquanto a área de atuação governamental corresponde à classificação econômica.","d)  Órgão e unidade orçamentária correspondem à classificação institucional, enquanto a área de atuação governamental corresponde à classificação funcional.","e)  Classificação institucional e funcional são equivalentes, pois ambas indicam o mesmo atributo da despesa."],"answer":"d","explanation":"A alternativa correta é D.\n\nA classificação institucional responde à pergunta “quem realiza a despesa?”, identificando o órgão e a unidade orçamentária responsáveis pela execução.\n\nA classificação funcional responde “em que área de atuação governamental a despesa será realizada?”, utilizando função e subfunção. No exemplo, Educação é a função e Ensino Fundamental é a subfunção.\n\nAs classificações não são equivalentes: cada uma evidencia atributo diferente da programação orçamentária."},{"bank":"FGV - Ana (TJ SC)/TJ SC/Contábil-Econômico/2026","num":"9","stem":"O Departamento de Planejamento e Orçamento está estruturando a sua proposta orçamentária para o próximo exercício financeiro. Durante a elaboração, a equipe técnica precisa classificar corretamente três demandas distintas:<br><br>I. A construção de um novo centro de pesquisa tecnológica, cujas obras estão planejadas para durar três anos.<br><br>II. A contratação contínua e permanente de serviços de vigilância e limpeza para a sede.<br><br>III. O pagamento de aposentadorias e pensões aos servidores inativos vinculados ao órgão.<br><br>Sobre a estrutura programática e as classificações orçamentárias, assinale a afirmativa correta.","options":["a)  A demanda I deve ser classificada como uma Atividade, pois, após a sua entrega, o novo centro de pesquisa exigirá operações de manutenção contínua e permanente por parte do Governo.","b)  A demanda II configura um Projeto, uma vez que a contratação de serviços terceirizados visa ao aperfeiçoamento da máquina pública, sendo seu produto consumido ao longo do tempo.","c)  A demanda III deve ser classificada como Operação Especial, pois trata-se de despesa que não contribui para a manutenção, expansão ou aperfeiçoamento das ações de governo, da qual não resulta um produto e não gera contraprestação direta sob a forma de bens ou serviços.","d)  A localização geográfica onde ocorrerá a construção do novo centro de pesquisa (demanda I) deverá ser identificada no orçamento obrigatoriamente pela Subfunção, a qual funciona como o agregador territorial do gasto público.","e)  As três demandas devem, obrigatoriamente, ser classificadas sob a mesma Função, que representa um nível de agregação inferior à subfunção e que evidencia a natureza específica de cada ação governamental isoladamente."],"answer":"c","explanation":"A alternativa correta é C.\n\nO pagamento de aposentadorias e pensões é classificado como operação especial porque não gera produto nem contraprestação direta sob a forma de bens ou serviços e não contribui diretamente para manutenção, expansão ou aperfeiçoamento das ações governamentais.\n\nA construção do centro é projeto: possui duração limitada e gera produto que amplia a atuação estatal. Vigilância e limpeza são atividades, pois ocorrem de forma contínua e permanente.\n\nSubfunção não é agregador territorial; ela representa uma área de atuação mais específica dentro da função. Além disso, função é nível de agregação superior à subfunção."},{"bank":"FGV - ACE (TCE-PI)/TCE PI/Comum/2025","num":"10","stem":"Do Manual Técnico do Orçamento depreende-se as possíveis tipologias para classificação da despesa. A esse respeito, assinale a afirmativa correta.","options":["a)  A classificação por Esfera Orçamentária é formada por funções e subfunções e procura explicitar as áreas em que as despesas são realizadas.","b)  Em se tratando de despesa por Esfera Orçamentária, há apenas duas possíveis classificações: 10 – Orçamento Fiscal e 20 – Orçamento da Seguridade Social.","c)  Na classificação por Esfera Orçamentária temos os dois primeiros dígitos para o Órgão Orçamentário e os três dígitos seguintes para a Unidade Orçamentária.","d)  A classificação institucional engloba o orçamento das empresas em que a União, direta ou indiretamente, detenha a maioria do capital social com direito a voto, ou seja, o Orçamento de Investimento.","e)  Em termos de Classificação Institucional, alguns fundos especiais podem figurar como um Órgão Orçamentário ou uma Unidade Orçamentária, sem corresponder, necessariamente, a uma estrutura administrativa."],"answer":"e","explanation":"A alternativa correta é E.\n\nNa classificação institucional, a estrutura é composta por órgão orçamentário e unidade orçamentária. Essa estrutura orçamentária nem sempre coincide com a estrutura administrativa formal. Por isso, fundos especiais podem aparecer como órgão ou unidade orçamentária sem corresponder, necessariamente, a um órgão administrativo autônomo.\n\nA alternativa A descreve a classificação funcional. A B está errada porque também existe o Orçamento de Investimento. A C descreve códigos da classificação institucional, não da esfera. A D confunde classificação institucional com esfera orçamentária."}]},{"id":2,"start":11,"end":20,"questions":[{"bank":"FGV - Ana CI (Pref Canaã Carajás)/Pref Canaã Carajás/2025","num":"11","stem":"Em uma entidade do setor público, a amortização da dívida pública, é classificada como","options":["a)  investimentos.","b)  despesas de custeio.","c)  inversões financeiras.","d)  transferências de capital.","e)  transferências correntes."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nDe acordo com a Lei nº 4.320/1964, a amortização da dívida pública integra as despesas de capital e é classificada como transferência de capital. Trata-se do pagamento do principal da dívida, isto é, da devolução do valor originalmente tomado pelo ente público.\n\nAs demais alternativas estão incorretas:\n• Investimentos correspondem, em regra, a obras, instalações, equipamentos e constituição ou aumento do capital de empresas que não tenham caráter comercial ou financeiro.\n• Despesas de custeio são despesas correntes destinadas à manutenção dos serviços públicos.\n• Inversões financeiras envolvem, por exemplo, aquisição de imóveis já em utilização, aquisição de títulos representativos de capital de empresas já constituídas e concessão de empréstimos.\n• Transferências correntes abrangem despesas correntes sem contraprestação direta em bens ou serviços, como subvenções e benefícios previdenciários."},{"bank":"FGV - Ana Adm (EBSERH)/HU Brasil/Administração/2025","num":"12","stem":"Despesa pública refere-se aos gastos realizados pelo Estado para manter o seu funcionamento, efetuados por meio da alocação adequada das receitas arrecadadas em sua atividade financeira.<br><br>Assinale a opção que apresenta um exemplo de despesa ordinária.","options":["a)  Repasse de recursos para o auxílio emergencial decorrente de calamidade pública.","b)  Remuneração de servidores públicos efetivos e pagamento de pensionistas.","c)  Financiamento de operações militares imprevistas e guerra externa.","d)  Custeio de novos órgãos governamentais sem a dotação orçamentária específica.","e)  Pagamento de gratificações extraordinárias e bônus não previstos anualmente."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nDespesa ordinária é aquela que ocorre de forma regular, previsível e contínua, integrando o funcionamento normal do Estado. A remuneração de servidores efetivos e o pagamento de pensionistas são despesas recorrentes, normalmente previstas no orçamento anual.\n\nAs demais alternativas representam situações extraordinárias, eventuais ou imprevisíveis:\n• auxílio emergencial por calamidade pública;\n• operações militares imprevistas e guerra externa;\n• criação ou custeio de novos órgãos sem dotação específica;\n• gratificações e bônus extraordinários não previstos anualmente."},{"bank":"FGV - Ana Adm (EBSERH)/HU Brasil/Contabilidade/2025","num":"13","stem":"Uma entidade do setor público apresentou as seguintes despesas em 2024:<br><br>Inversões financeiras: ..............................................R$ 120.000,00;<br><br>Investimentos: .........................................................R$ 200.000,00;<br><br>Despesas de custeio: ...............................................R$ 400.000,00.<br><br>Assinale a opção que indica o total das despesas de capital da entidade.","options":["a)  R$ 120.000,00.","b)  R$ 200.000,00.","c)  R$ 320.000,00.","d)  R$ 600.000,00.","e)  R$ 720.000,00."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nAs despesas de capital são formadas por:\n• Investimentos;\n• Inversões financeiras;\n• Transferências de capital.\n\nNo caso:\nR$ 120.000,00 de inversões financeiras\n+ R$ 200.000,00 de investimentos\n= R$ 320.000,00 de despesas de capital.\n\nAs despesas de custeio, no valor de R$ 400.000,00, são despesas correntes e não entram no cálculo."},{"bank":"FGV - Ana MPU/MPU/Perito/Contabilidade/2025","num":"14","stem":"A estrutura da programação orçamentária é formada por uma sequência de códigos alfanuméricos separados por pontos. Cada um desses grupos de códigos se refere a um tipo de classificador orçamentário distinto e traz informações qualitativas e quantitativas acerca da despesa. O Manual Técnico de Orçamento (MTO) organiza as categorias de classificação da despesa em qualitativas (programa de trabalho) e quantitativas (programação orçamentária).<br><br>Uma categoria de classificação tratada no MTO como elemento qualitativo do plano de trabalho é o(a):","options":["a)  categoria econômica da despesa;","b)  elemento de despesa;","c)  estrutura programática;","d)  grupo de natureza de despesa;","e)  modalidade de aplicação."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA estrutura programática integra a classificação qualitativa da despesa. Ela evidencia o programa, a ação orçamentária e outros atributos que demonstram o que será realizado pelo governo.\n\nJá categoria econômica, grupo de natureza da despesa, modalidade de aplicação e elemento de despesa são classificadores ligados à dimensão quantitativa da programação orçamentária, pois detalham a natureza do gasto e a forma de aplicação dos recursos."},{"bank":"FGV - Ana MPU/MPU/Perito/Contabilidade/2025","num":"15","stem":"Um órgão público destinou uma sala do último andar do seu edifício sede para instalação de uma biblioteca com acervo bibliográfico técnico para uso dos servidores lotados no órgão. Para a instalação da biblioteca, o órgão incorreu nos seguintes gastos:<br><br>Para a instalação da biblioteca, o órgão incorreu nos seguintes gastos:<br><br>\n<table>\n<thead><tr><th>Descrição</th><th>Valor</th></tr></thead>\n<tbody>\n<tr><td>Serviço de reforma para adaptação do espaço</td><td>R$ 23.000</td></tr>\n<tr><td>Aquisição de mobiliário (estantes, mesas, cadeiras)</td><td>R$ 59.000</td></tr>\n<tr><td>Aquisição de computadores</td><td>R$ 10.000</td></tr>\n<tr><td>Aquisição de material bibliográfico (livros, manuais, atlas, mapas etc.)</td><td>R$ 95.000</td></tr>\n<tr><td>Contratação de licença anual de software de controle e gestão do acervo</td><td>R$ 13.000</td></tr>\n<tr><th>Total</th><th>R$ 200.000</th></tr>\n</tbody></table><br>\nDentre os gastos incorridos, os que devem ser classificados como despesa de capital totalizam:","options":["a)  R$ 69.000;","b)  R$ 82.000;","c)  R$ 164.000;","d)  R$ 177.000;","e)  R$ 187.000."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nDevem ser classificados como despesas de capital os gastos que resultam na formação ou aquisição de bens permanentes:\n\n• Mobiliário: R$ 59.000;\n• Computadores: R$ 10.000;\n• Material bibliográfico permanente: R$ 95.000.\n\nTotal:\nR$ 59.000 + R$ 10.000 + R$ 95.000 = R$ 164.000.\n\nA reforma para adaptação do espaço, no contexto da questão, foi tratada como serviço de manutenção/adaptação, classificado como despesa corrente. A licença anual de software também é despesa corrente, pois representa contratação temporária de uso, sem aquisição definitiva de ativo intangível."},{"bank":"FGV - AJ TRT24/TRT 24/Administrativa/Contabilidade/2025","num":"16","stem":"De acordo com a Lei nº 4.320/1964, a despesa é classificada como corrente e de capital.<br><br>Assinale a opção que classifica corretamente o exemplo.","options":["a)  Investimentos: serviços em regime de programação especial.","b)  Transferências Correntes: material de consumo.","c)  Transferências de Capital: concessão de empréstimos.","d)  Despesas de Custeio: salário família e abono familiar.","e)  Inversões Financeiras: auxílios para equipamentos e instalações."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nSegundo a Lei nº 4.320/1964, os investimentos incluem as dotações destinadas ao planejamento e à execução de obras, inclusive aquisição de imóveis necessários a essas obras, bem como programas especiais de trabalho, aquisição de instalações, equipamentos e material permanente.\n\nErros das demais:\n• Material de consumo é despesa de custeio, não transferência corrente.\n• Concessão de empréstimos é inversão financeira, não transferência de capital.\n• Salário-família e abono familiar são transferências correntes.\n• Auxílios para equipamentos e instalações são transferências de capital, não inversões financeiras."},{"bank":"FGV - AJ TRT24/TRT 24/Administrativa/\"Sem Especialidade\"/2025","num":"17","stem":"Uma entidade do setor público incorreu em despesas com a aquisição de passagens aéreas e pagamento de taxas de embarque para funcionários que mudaram o seu domicílio por conta de demandas internas da administração da entidade.<br><br>Ao verificar o grupo de natureza da despesa orçamentária, é correto classificar esses gastos como","options":["a)  investimentos.","b)  inversões financeiras.","c)  amortização da dívida.","d)  pessoal e encargos sociais.","e)  outras despesas correntes."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nPassagens aéreas e taxas de embarque não representam aquisição de bens permanentes, amortização de dívida nem pagamento direto de remuneração ou encargos sociais. São gastos necessários ao funcionamento da administração, classificados no Grupo de Natureza da Despesa 3 — Outras Despesas Correntes.\n\nEsse grupo reúne despesas correntes que não se enquadram em Pessoal e Encargos Sociais nem em Juros e Encargos da Dívida."},{"bank":"FGV - Tec MPU/MPU/Administração/2025","num":"18","stem":"Na classificação programática da despesa pública, as ações orçamentárias podem ser tipificadas como Projetos, Atividades ou Operações Especiais.<br><br>Na análise do rol de ações previstas na Lei Orçamentária Anual, é necessário considerar que:","options":["a)  a produção das ações do tipo Projeto contribui para o aperfeiçoamento da ação de governo, mas não se incorpora ao patrimônio público;","b)  as ações do tipo Atividade mantêm o nível da produção pública;","c)  as ações do tipo Operação Especial são iniciadas com o dígito 9 e se referem a despesas que contribuem para a expansão das ações de governo;","d)  as ações relativas a transferências ou repasses a fundo devem ser sempre classificadas como Atividades;","e)  é facultada a existência de um mesmo projeto em programas diferentes."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nAtividade é um instrumento de programação utilizado para alcançar o objetivo de um programa, envolvendo operações contínuas e permanentes. Seu resultado é um produto necessário à manutenção da ação governamental, razão pela qual mantém o nível da produção pública.\n\nAs demais estão incorretas:\n• Projeto é limitado no tempo e normalmente contribui para expansão ou aperfeiçoamento da ação de governo, podendo resultar em produto que se incorpora ao patrimônio público.\n• Operação Especial não contribui para manutenção, expansão ou aperfeiçoamento das ações do governo e não gera produto.\n• Transferências e repasses não são sempre Atividades; podem ser Operações Especiais, conforme sua natureza.\n• Um mesmo projeto não deve ser duplicado em programas distintos."},{"bank":"FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2025","num":"19","stem":"Em junho de 2025, uma entidade do setor público reconheceu R$ 60.000,00 como despesas orçamentárias com auxílio-alimentação pagas por meio de cartão magnético. Do valor, R$ 48.000,00 foram destinados a servidores e R$ 12.000,00, a estagiários.<br><br>Em relação ao elemento de despesa, deve ser contabilizado como “Auxílio-Alimentação” o seguinte valor:","options":["a)  zero.","b)  R$ 12.000,00.","c)  R$ 36.000,00.","d)  R$ 48.000,00.","e)  R$ 60.000,00."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nO elemento de despesa “Auxílio-Alimentação” registra as despesas com auxílio-alimentação pago em pecúnia, cartão magnético ou meio equivalente, abrangendo servidores e também outros beneficiários previstos na classificação, como estagiários.\n\nAssim:\nR$ 48.000,00 destinados a servidores\n+ R$ 12.000,00 destinados a estagiários\n= R$ 60.000,00.\n\nPortanto, todo o valor deve ser contabilizado no elemento Auxílio-Alimentação."},{"bank":"FGV - AUCE (TCE-PE)/TCE PE/Contas Públicas de Saúde/2025","num":"20","stem":"A respeito da classificação das despesas públicas, relacione a tipologia à respectiva descrição.<br><br>1. Despesa Obrigatória<br><br>2. Despesa Discricionária<br><br>3. Despesa Corrente<br><br>4. Despesa de Capital<br><br>(  ) É aquela em que o gestor público possui flexibilidade quanto ao estabelecimento de seu montante e quanto à oportunidade de sua execução.<br><br>(  ) Contribui para a ampliação da oferta de bens e serviços de responsabilidade do Estado.<br><br>(  ) Está prevista na Constituição ou em Lei.<br><br>(  ) Caracteriza-se pela manutenção das atividades relacionadas à prestação dos bens e serviços de responsabilidade do Estado.<br><br>A sequência correta, segundo a ordem apresentada, é:","options":["a)  1 – 2 – 3 – 4.","b)  4 – 2 – 1 – 3.","c)  1 – 3 – 2 – 4.","d)  2 – 4 – 1 – 3.","e)  4 – 2 – 3 – 1."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA sequência correta é 2 – 4 – 1 – 3:\n\n• Despesa discricionária (2): o gestor possui flexibilidade quanto ao montante e ao momento de execução.\n• Despesa de capital (4): contribui para a ampliação da oferta de bens e serviços do Estado, especialmente por meio de investimentos.\n• Despesa obrigatória (1): decorre de determinação constitucional ou legal.\n• Despesa corrente (3): está relacionada à manutenção das atividades e dos serviços públicos.\n\nLogo, a ordem correta é 2 – 4 – 1 – 3."}]},{"id":3,"start":21,"end":30,"questions":[{"bank":"FGV - Ag (AGESAN RS)/AGESAN RS/Controle Financeiro e Contábil/2025","num":"21","stem":"Em relação ao Grupo de Natureza da Despesa das Inversões Financeiras, analise as despesas orçamentárias a seguir.<br><br>\nI. Aquisição de Títulos Representativos do Capital já Integralizado.<br><br>\nII. Refinanciamento do principal e da atualização monetária da dívida pública interna.<br><br>\nIII. Pagamento de juros, comissões e outros encargos de operações de crédito externas contratadas.<br><br>\nPodem ser classificadas como Inversões Financeiras as despesas orçamentárias com","options":["a)  I, apenas.","b)  I e II, apenas.","c)  I e III, apenas.","d)  II e III, apenas.","e)  I, II e III."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nSomente o item I representa inversão financeira.\n\nI. Aquisição de títulos representativos do capital já integralizado:\nÉ classificada como inversão financeira, pois corresponde à aquisição de participação societária em empresa já constituída.\n\nII. Refinanciamento do principal e da atualização monetária da dívida pública interna:\nÉ classificado no grupo Amortização da Dívida, e não como inversão financeira.\n\nIII. Pagamento de juros, comissões e outros encargos de operações de crédito externas:\nÉ classificado no grupo Juros e Encargos da Dívida.\n\nPortanto, apenas a despesa descrita no item I é uma inversão financeira."},{"bank":"FGV - Tec (Nittrans)/Nittrans/Contábil/2025","num":"22","stem":"Uma entidade do setor público reconheceu dotação destinada à aquisição de imóveis.<br><br>\nAssinale a opção que faz uso dessa classificação.","options":["a)  Investimentos.","b)  Despesas de Custeio.","c)  Inversões Financeiras.","d)  Transferências Correntes.","e)  Transferências de Capital."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA aquisição de imóveis, quando não vinculada à execução de uma obra pública, é classificada como inversão financeira.\n\nAs inversões financeiras abrangem, entre outras despesas:\n• aquisição de imóveis já em utilização;\n• aquisição de bens de capital já em uso;\n• aquisição de títulos representativos do capital de empresas já constituídas;\n• concessão de empréstimos.\n\nA aquisição de imóvel necessário à realização de uma obra poderia integrar investimentos, mas a questão apenas informa a aquisição do imóvel, sem vinculá-la a obra pública. Por isso, a classificação indicada é inversões financeiras."},{"bank":"FGV - APJ (TJ RS)/TJ RS/Administrativa/2025","num":"23","stem":"Em 2020, um estado brasileiro contraiu um empréstimo de longo prazo, com amortização gradual realizada anualmente. De acordo com a Lei nº 6.320/64, as dotações para amortização da dívida pública são classificadas como","options":["a)  investimentos.","b)  despesas de custeio.","c)  inversões financeiras.","d)  transferências correntes.","e)  transferências de capital."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nAs dotações destinadas à amortização da dívida pública são classificadas como transferências de capital.\n\nA amortização representa o pagamento do principal da dívida, isto é, a devolução do valor tomado pelo ente público. Por isso, não se confunde com:\n• juros e encargos da dívida, que são despesas correntes;\n• investimentos;\n• inversões financeiras;\n• despesas de custeio.\n\nAssim, o pagamento anual do principal do empréstimo é uma transferência de capital."},{"bank":"FGV - Ana Geo (CPRM)/CPRM/Administração/2025","num":"24","stem":"Quanto à categoria econômica relativa às despesas correntes, aquela que é destinada a pagamentos de pessoal, incluindo encargos, serviços de terceiros e aquisição de material de consumo, denomina-se despesa","options":["a)  passiva.","b)  de custeio.","c)  obrigatória.","d)  empenhada.","e)  administrativa."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nAs despesas de custeio são despesas correntes destinadas à manutenção e ao funcionamento dos serviços públicos.\n\nElas abrangem, entre outros gastos:\n• pagamento de pessoal e encargos;\n• aquisição de material de consumo;\n• contratação de serviços de terceiros;\n• conservação e manutenção de bens e serviços públicos.\n\nAs demais expressões apresentadas não correspondem à classificação econômica definida para esse conjunto de despesas."},{"bank":"FGV - Ana Geo (CPRM)/CPRM/Contabilidade/2025","num":"25","stem":"Uma entidade do setor público reconheceu dotações para despesas com subvenções sociais e econômicas.<br><br>\nAs subvenções sociais e as subvenções econômicas podem ser classificadas, respectivamente, como","options":["a)  transferências correntes e despesa de custeio.","b)  despesa de custeio e transferências de capital.","c)  transferências correntes e transferências de capital.","d)  transferências de capital e transferências de capital.","e)  transferências correntes e transferências correntes."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nTanto as subvenções sociais quanto as subvenções econômicas são classificadas como transferências correntes.\n\nSubvenções sociais:\nDestinam-se a instituições públicas ou privadas de caráter assistencial ou cultural, sem finalidade lucrativa.\n\nSubvenções econômicas:\nDestinam-se a empresas públicas ou privadas de caráter industrial, comercial, agrícola ou pastoril, conforme as hipóteses legais.\n\nComo não representam aquisição direta de bens ou serviços para o ente público e têm natureza corrente, ambas pertencem às transferências correntes."},{"bank":"FGV - Ana Cont (ALEAM)/ALEAM/2025","num":"26","stem":"O Município de Felicidade do Norte iniciou a elaboração da sua proposta orçamentária para o exercício de 2025. Durante a análise técnica, a equipe de planejamento identificou inconsistências na classificação de algumas despesas e receitas, especialmente no que diz respeito à correta vinculação entre Programa de Governo, Ação Orçamentária e Fontes de Recursos. Entre os erros verificados, constavam:<br><br>\n\nI. A classificação de uma despesa de reforma com ampliação de unidade básica de saúde sob a subfunção 365 - Educação Infantil;<br><br>\n\nII. A inclusão de taxas de coleta de lixo na categoria econômica de receitas de capital;<br><br>\n\nIII. A vinculação de uma emenda parlamentar de bancada para aquisição de ambulância a um programa genérico de administração e não ao programa setorial de saúde; e<br><br>\n\nIV. A ausência de detalhamento da despesa quanto ao grupo de natureza e ao identificador de uso.<br><br>\n\nCom base no caso descrito e nas classificações orçamentárias previstas na Lei nº 4.320/1964, na Portaria MOG nº 42/1999 e suas alterações, além do Manual Técnico do Orçamento (MTO 2025), assinale a alternativa correta.","options":["a)  A despesa de reforma da unidade básica de saúde deve ser classificada na subfunção 301 – Atenção Básica, pertencente à função 10 – Saúde e vinculada a uma ação orçamentária de natureza de projeto, uma vez que se refere à ampliação ou melhoria do patrimônio público.","b) As taxas de coleta de lixo integram a categoria Receitas de Capital, pois são recursos provenientes de contraprestações específicas do contribuinte.","c) A emenda parlamentar, por representar recurso adicional ao orçamento, deve ser alocada em um programa de apoio administrativo, sem vinculação obrigatória à área finalística da despesa, conforme a autonomia do ente federado.","d) O detalhamento por grupo de natureza da despesa (GND) é facultativo, sendo exigido apenas para despesas de custeio, já que os investimentos são controlados apenas pelo elemento de despesa e pela função programática.","e) O identificador de uso (IDUSO) é aplicado apenas à receita pública e serve para diferenciar se o recurso é livre ou vinculado, sendo dispensado nas despesas, conforme as regras do MTO 2025."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA reforma com ampliação de uma unidade básica de saúde deve ser vinculada à função 10 — Saúde e à subfunção 301 — Atenção Básica. Como a intervenção possui prazo determinado e gera ampliação ou melhoria do patrimônio público, deve ser estruturada como projeto.\n\nAnálise das demais:\n• As taxas de coleta de lixo são receitas correntes, classificadas como receitas tributárias, e não receitas de capital.\n• A emenda destinada à aquisição de ambulância deve ser vinculada ao programa finalístico de saúde, pois sua finalidade está diretamente relacionada à prestação de serviços de saúde.\n• O Grupo de Natureza da Despesa não é facultativo; ele integra a classificação da natureza da despesa.\n• O identificador de uso também é utilizado na programação da despesa, especialmente para indicar a existência de contrapartida de recursos."},{"bank":"FGV - Ana Cont (ALEAM)/ALEAM/2025","num":"27","stem":"Recentemente as subfunções da Função 08 – Assistência Social sofreram adequações conceituais e terminológicas relevantes para o aperfeiçoamento da classificação funcional do gasto público. Considerando o disposto nas portarias da Secretaria do Orçamento Federal e os conceitos definidos no Manual Técnico do Orçamento (MTO), assinale a alternativa correta.","options":["a) A função representa o nível mais detalhado da classificação funcional, sendo vinculada a um programa orçamentário, enquanto a subfunção corresponde ao agrupamento de despesas segundo a natureza econômica da ação governamental.","b) As subfunções 245 – Serviços Socioassistenciais e 246 – Segurança de Renda foram criadas pela Portaria SOF/MPO nº 169/2024 e representam a expansão da cobertura da Função 08, reforçando a dimensão protetiva e distributiva do SUAS, com vigência a partir de 2025.","c) A subfunção 244 - Assistência Comunitária foi extinta e substituída pela subfunção 245 - Serviços Socioassistenciais, que reflete a organização dos serviços continuados de proteção básica e especial.","d) A atualização da Portaria SOF/MPO nº 169/2024 preservou as subfunções anteriores, mas ajustou suas nomenclaturas a uma terminologia de direitos, substituindo expressões como “portador de deficiência” por “pessoa com deficiência”, além de incluir as novas subfunções 245 – Serviços Socioassistenciais e 246 – Segurança de Renda, cujos efeitos passam a valer a partir de 2025.","e) A Portaria SOF/MPO nº 221/2023 adequou as subfunções 241 – Assistência ao Idoso e 242 - Assistência ao Portador de Deficiência da função 08 - Assistência Social para 241 – Assistência à Pessoa Idosa e 242 - Assistência à Pessoa com Deficiência, respectivamente, a fim de ajustar as subfunções existentes a nomenclaturas condizentes com o respeito que deve ser tratado cada cidadão, com vigência a partir de 2024."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nAs subfunções 245 — Serviços Socioassistenciais e 246 — Segurança de Renda foram criadas para aperfeiçoar a classificação funcional da assistência social e permitir maior precisão na identificação dos gastos associados à proteção social e à garantia de renda.\n\nAnálise das demais:\n• A função representa o maior nível de agregação das áreas de atuação governamental, enquanto a subfunção detalha a área de atuação.\n• A subfunção 244 — Assistência Comunitária não foi simplesmente extinta e substituída pela subfunção 245.\n• A alternativa D mistura mudanças terminológicas com a criação das novas subfunções e apresenta afirmação diferente daquela considerada correta pela banca.\n• A alternativa E atribui a mudança a outra portaria e apresenta vigência incompatível com o gabarito da questão."},{"bank":"FGV - AEC (CGE SP)/CGE SP/Auditoria/2025","num":"28","stem":"Na Lei Orçamentária da União do ano 20XX (LOA) consta a ação orçamentária nº 123F, com dotação para indenização a familiares de mortos e desaparecidos em razão da participação em atividades políticas.<br><br>\nEssa ação orçamentária deve ser tipificada como","options":["a)  projeto.","b)  atividade.","c)  subvenção social.","d)  operação especial.","e)  transferência de capital."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA indenização a familiares de mortos e desaparecidos é uma operação especial.\n\nOperações especiais são despesas que:\n• não contribuem diretamente para a manutenção, expansão ou aperfeiçoamento das ações governamentais;\n• não geram um produto diretamente associado à ação;\n• não representam uma atividade contínua de prestação de serviço público nem um projeto limitado no tempo com produto final.\n\nO pagamento de indenizações enquadra-se nessa definição, pois corresponde a uma obrigação financeira do Estado sem geração direta de bem ou serviço."},{"bank":"FGV - AEC (CGE SP)/CGE SP/Auditoria/2025","num":"29","stem":"Utilizando a classificação da natureza da despesa, o contador do Município Beta registrou uma despesa pública por meio do seguinte código:<br><br>\n<strong>ND: 4.5.70.00</strong><br><br>\nA análise do registro da referida despesa permite concluir, corretamente, que","options":["a)  sua categoria econômica é de despesa corrente.","b)  houve o devido detalhamento do subelemento de despesa.","c)  o grupo de natureza de despesas indica tratar-se de inversão financeira.","d)  a modalidade de aplicação informada refere-se à transferência aos municípios.","e)  o elemento de despesa está indicado no segundo dígito, representado pelo algarismo “5”."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nO código ND 4.5.70.00 pode ser interpretado assim:\n\n• 4 — Categoria econômica: Despesa de Capital;\n• 5 — Grupo de Natureza da Despesa: Inversões Financeiras;\n• 70 — Modalidade de Aplicação;\n• 00 — Elemento de Despesa não detalhado.\n\nLogo, o segundo dígito, representado pelo número 5, indica que a despesa pertence ao grupo Inversões Financeiras.\n\nAs demais estão incorretas porque:\n• o primeiro dígito 4 indica despesa de capital, e não corrente;\n• o elemento de despesa não foi detalhado, pois consta 00;\n• a modalidade 70 não significa transferência a municípios;\n• o segundo dígito representa o grupo de natureza, e não o elemento de despesa."},{"bank":"FGV - AEC (CGE SP)/CGE SP/Auditoria/2025","num":"30","stem":"A Lei Orçamentária do Município Alfa previu dotações orçamentárias concernentes à transferência de recursos do tesouro para cobertura de déficit de manutenção de uma autarquia municipal.<br><br>\nNos termos da Lei nº 4.320/1964, essa despesa deve ser classificada como","options":["a)  investimento.","b)  inversão financeira.","c)  operação de crédito.","d)  subvenção econômica.","e)  transferência de capital."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA transferência de recursos do tesouro para cobrir déficit de manutenção de uma entidade pública é classificada como subvenção econômica.\n\nAs subvenções econômicas integram as transferências correntes e podem ser destinadas à cobertura de déficits de manutenção de empresas públicas, autarquias ou outras entidades, nas hipóteses previstas na legislação.\n\nNão se trata de:\n• investimento, pois não há formação ou aquisição de bem de capital;\n• inversão financeira;\n• operação de crédito;\n• transferência de capital, pois a finalidade é cobrir despesas de manutenção."}]},{"id":4,"start":31,"end":40,"questions":[{"bank":"FGV - AEC (CGE SP)/CGE SP/Auditoria/2025","num":"31","stem":"O Município Gama realizou despesa para aquisição de um imóvel que já era utilizado pela Administração Municipal para prestação de serviços de educação infantil.<br><br>\nNos termos da Lei nº 4.320/1964, essa despesa deve ser classificada como","options":["a)  investimento.","b)  despesa corrente.","c)  inversão financeira.","d)  transferência corrente.","e)  subvenção econômica."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA aquisição de imóvel já utilizado pela Administração é classificada como inversão financeira.\n\nSegundo a Lei nº 4.320/1964, as inversões financeiras abrangem, entre outras hipóteses, a aquisição de imóveis ou de bens de capital já em utilização.\n\nNão se trata de investimento, pois o imóvel não está sendo adquirido para execução de uma nova obra pública. Também não é despesa corrente, transferência corrente ou subvenção econômica."},{"bank":"FGV - AEC (CGE SP)/CGE SP/Contabilidade Pública e Finanças/2025","num":"32","stem":"O Governo do Estado de São Paulo, em execução do orçamento de 2025, realizou o pagamento de contraprestações pecuniárias a um parceiro privado no âmbito de uma Parceria Público-Privada (PPP) na modalidade Concessão Administrativa.<br><br>\n\nA contraprestação é estruturada, então, da seguinte forma:<br><br>\n\n1. Parcela Corrente: Remuneração pela prestação dos serviços contratados (custeio).<br><br>\n\n2. Parcela de Capital: Despesa decorrente da incorporação de bens de capital (Contrato PPP) reversíveis ao patrimônio público.<br><br>\n\nA classificação da despesa na estrutura classificatória (C.G.MM.EE) deve ser precisa, onde C = Categoria Econômica, G = Grupo de Natureza de Despesa, MM = Modalidade de Aplicação e EE = Elemento de Despesa.<br><br>\n\nCom base nos conceitos de natureza da despesa aplicáveis a esse tipo de operação, assinale a opção que apresenta a classificação correta e respectiva das parcelas (1) Corrente e (2) de Capital.","options":["a)  (1) 3.3.90.39 – outras Despesas Correntes, Aplicações Diretas, outros Serviços de Terceiros – Pessoa Jurídica. (2) 4.4.67.82 – Despesas de Capital, Investimentos, Execução de Contrato de PPP, aporte de Recursos pelo Parceiro Público.","b)  (1) 3.3.67.45 – Despesas Correntes, outras Despesas Correntes, Execução de Contrato de PPP, Subvenções Econômicas. (2) 4.5.67.83 – Despesas de Capital, Inversões Financeiras, Execução de Contrato de PPP, Despesas Decorrentes de PPP.","c)  (1) 3.3.67.83 – Despesas Correntes, outras Despesas Correntes, Execução de Contrato de PPP, Despesas Decorrentes de PPP. (2) 4.5.67.83 – Despesas de Capital, Inversões Financeiras, Execução de Contrato de PPP, Despesas Decorrentes de PPP.","d)  (1) 3.3.67.83 – Despesas Correntes, outras Despesas Correntes, Execução de Contrato de PPP, Despesas Decorrentes de PPP. (2) 4.4.67.52 – Despesas de Capital, Investimentos, Execução de Contrato de PPP, Equipamentos e Material Permanente.","e)  (1) 3.3.91.85 – Despesas Correntes, outras Despesas Correntes, Aplicação Direta Decorrente de Operação entre Órgãos, Contrato de Gestão. (2) 4.5.90.65 – Despesas de Capital, Inversões Financeiras, Aplicações Diretas, Constituição ou Aumento de Capital de Empresas."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA parcela corrente é registrada em 3.3.67.83:\n• 3 — Despesa Corrente;\n• 3 — Outras Despesas Correntes;\n• 67 — Execução de Contrato de Parceria Público-Privada;\n• 83 — Despesas Decorrentes de Contrato de PPP.\n\nA parcela de capital é registrada em 4.5.67.83:\n• 4 — Despesa de Capital;\n• 5 — Inversões Financeiras;\n• 67 — Execução de Contrato de PPP;\n• 83 — Despesas Decorrentes de Contrato de PPP.\n\nPortanto, a classificação correta e respectiva das parcelas corrente e de capital é 3.3.67.83 e 4.5.67.83."},{"bank":"FGV - Ass Jur (ALEAM)/ALEAM/2025","num":"33","stem":"A classificação funcional da despesa pública, prevista na Lei nº 4.320/1964 e detalhada pela Portaria SOF/MPO nº 42/1999, com alterações pelas Portarias nº 221/2023 e 169/2024, organiza os gastos segundo as áreas de atuação do governo, permitindo identificar a finalidade e o objetivo do gasto. Com base nas referidas normas, assinale a alternativa correta.","options":["a) A função representa o menor nível de agregação da despesa pública, sendo utilizada para fins contábeis internos do órgão executor.","b) A subfunção identifica a unidade administrativa responsável pela execução orçamentária, como ministérios e secretarias.","c) A classificação funcional busca evidenciar a área de atuação governamental, sendo a função o maior nível de agregação e a subfunção uma subdivisão que detalha o tipo de ação.","d) A função e a subfunção correspondem, respectivamente, às classificações programática e econômica da despesa, conforme a Lei nº 4.320/1964.","e) A Portaria SOF/MPO nº 169/2024 revogou a função 08 – Assistência Social, substituindo-a por Serviços Socioassistenciais."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA classificação funcional mostra em qual área de atuação governamental a despesa será realizada.\n\nA função representa o maior nível de agregação das áreas de atuação do governo. A subfunção é uma subdivisão da função e evidencia uma área mais específica da ação governamental.\n\nAs demais alternativas confundem a classificação funcional com:\n• classificação institucional, que identifica órgãos e unidades;\n• classificação programática;\n• classificação econômica.\n\nA função 08 — Assistência Social não foi revogada."},{"bank":"FGV - Proc (ALEAM)/ALEAM/2025","num":"34","stem":"A classificação funcional é um dos eixos estruturantes da despesa orçamentária, sendo disciplinada pela Portaria SOF/SETO/ME nº 42/1999 e suas atualizações. A respeito das inovações introduzidas na Função 08 – Assistência Social, assinale a alternativa correta.","options":["a) A Portaria SOF/MPO nº 221/2023 introduziu as subfunções 245 - Serviços Socioassistenciais e 246 - Segurança de Renda, buscando consolidar a dimensão protetiva do SUAS (Serviço Único de Assistência Social) e uniformizar o tratamento das transferências de renda, com efeitos a partir do exercício financeiro de 2024.","b) A Portaria SOF/MPO nº 169/2024 manteve a estrutura original da função 08, limitando-se a alterar terminologias para alinhar a nomenclatura das subfunções aos princípios da dignidade humana.","c) A Portaria SOF/SETO/ME nº 42/1999 determinou que a classificação funcional é de uso facultativo pelos entes subnacionais, cabendo aos Estados e Municípios ajustarem suas estruturas classificatórias conforme peculiaridades locais.","d) A combinação entre as Portarias SOF/MPO nº 221/2023 e nº 169/2024 demonstra a evolução normativa do sistema de classificação funcional, uma vez que a primeira atualizou terminologias (Assistência à Pessoa com Deficiência) com vigência a partir de 2024, e a segunda acrescentou duas novas subfunções (245 Serviços Socioassistenciais e 246 Segurança de Renda) com vigência a partir de 2025, consolidando o alinhamento da função 08 à lógica dos direitos socioassistenciais e à estrutura do SUAS (Serviço Único de Assistência Social).","e) As subfunções criadas pela Portaria SOF/MPO nº 169/2024 se aplicam exclusivamente à União, em razão do princípio federativo e da autonomia orçamentária dos entes subnacionais, que podem adotar classificações distintas em seus instrumentos de planejamento."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA Portaria SOF/MPO nº 221/2023 atualizou terminologias da Função 08 — Assistência Social, adotando expressões compatíveis com a linguagem de direitos, com efeitos a partir de 2024.\n\nPosteriormente, a Portaria SOF/MPO nº 169/2024 incluiu as subfunções:\n• 245 — Serviços Socioassistenciais;\n• 246 — Segurança de Renda.\n\nEssas novas subfunções passaram a produzir efeitos a partir de 2025, permitindo maior detalhamento dos gastos relacionados ao SUAS.\n\nAs demais alternativas apresentam erro quanto à portaria responsável, à vigência ou ao alcance da classificação funcional."},{"bank":"FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2024","num":"35","stem":"A despesa orçamentária é classificada em duas categorias econômicas: correntes e de capital.<br><br>\n\nAs despesas de capital mantêm uma correlação com o registro de incorporação de","options":["a)  ativo ou passivo circulante.","b)  ativo circulante ou realizável a longo prazo.","c)  ativo imobilizado, intangível ou investimento.","d)  ativo realizável a longo prazo, imobilizado, intangível ou investimento","e)  ativo realizável a longo prazo, imobilizado, intangível, investimento ou passivo não circulante."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nAs despesas de capital normalmente estão associadas à formação ou aquisição de ativos de natureza permanente.\n\nPor isso, mantêm correlação com o registro de incorporação de:\n• ativo imobilizado;\n• ativo intangível;\n• investimentos.\n\nAtivos circulantes, passivos circulantes e passivos não circulantes não representam, por si só, a correlação típica indicada para as despesas de capital na questão."},{"bank":"FGV - Tec Leg(CM SP)/CM SP/Contabilidade/2024","num":"36","stem":"A Lei 4320/64 classifica as despesas como correntes e de capital. Em relação às despesas de capital, assinale a opção que indica despesas classificadas como Inversões Financeiras.","options":["a)  Obras públicas.","b)  Concessão de Empréstimos.","c)  Auxílios para Obras Públicas.","d)  Amortização da Dívida Pública.","e)  Auxílios para Equipamentos e Instalações."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA concessão de empréstimos é classificada como inversão financeira.\n\nAs demais alternativas possuem classificações diferentes:\n• obras públicas: investimentos;\n• auxílios para obras públicas: transferências de capital;\n• amortização da dívida pública: transferências de capital;\n• auxílios para equipamentos e instalações: transferências de capital.\n\nAssim, apenas a concessão de empréstimos corresponde a inversão financeira."},{"bank":"FGV - ACP (CGE PB)/CGE PB/Auditoria Contábil e Finanças Públicas/2024","num":"37","stem":"Um ente federado recebeu um pedido amparado pela Lei de Acesso à Informação no qual foi solicitada a disponibilização de informação pormenorizada acerca do que se pretende alcançar com a implementação de políticas públicas na área de gestão ambiental e sustentabilidade ao longo do exercício financeiro corrente.<br><br>\n\nO pedido pode ser atendido com o fornecimento de informações:","options":["a)  categorizadas por grupo de natureza de despesa;","b)  constantes no relatório resumido da execução orçamentária;","c)  da estrutura programática da despesa;","d)  dos anexos da lei de diretrizes orçamentárias;","e)  organizadas conforme a respectiva função governamental."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA estrutura programática da despesa evidencia o que o governo pretende alcançar por meio dos programas e das ações orçamentárias.\n\nEla apresenta informações relacionadas:\n• aos objetivos dos programas;\n• aos produtos das ações;\n• às metas;\n• aos resultados esperados.\n\nA classificação por grupo de natureza mostra o objeto econômico do gasto. A função governamental mostra apenas a área de atuação, sem detalhar suficientemente o que se pretende alcançar."},{"bank":"FGV - ACP (CGE PB)/CGE PB/Auditoria Contábil e Finanças Públicas/2024","num":"38","stem":"Um ente público alugou um imóvel para instalação de uma das suas secretarias. Para adequar o imóvel às necessidades do ente foi necessário adquirir e instalar divisórias removíveis e persianas.<br><br>\n\nUm servidor recém-lotado da divisão de gestão patrimonial do ente tinha dúvidas quanto ao tratamento contábil desses itens, dada a sua natureza, e foi orientado que tais itens:","options":["a)  terão seu valor descontado do valor do aluguel do imóvel;","b)  devem ser, em geral, tombados como material permanente;","c)  serão classificados como despesa orçamentária de natureza corrente;","d)  devem ser tratados como despesas do exercício em que foram adquiridos;","e)  não estão sujeitos à depreciação sistemática, por estarem instalados em imóvel de terceiros."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nDivisórias removíveis e persianas possuem vida útil superior a dois anos e podem ser retiradas ou reutilizadas em outro local. Em regra, são classificadas como material permanente e devem ser incorporadas ao patrimônio do ente.\n\nO fato de estarem instaladas em imóvel alugado não elimina a necessidade de controle patrimonial.\n\nTambém não significa que sejam automaticamente despesas correntes ou que não estejam sujeitas à depreciação."},{"bank":"FGV - ACP (CGE PB)/CGE PB/Auditoria Contábil e Finanças Públicas/2024","num":"39","stem":"Na estrutura das classificações orçamentárias, a dimensão financeira estima o montante necessário para o desenvolvimento da ação orçamentária de acordo com categorias preestabelecidas.<br><br>\n\nAo analisar a adoção da estrutura de classificação dos componentes da programação financeira, deve-se considerar que a categoria modalidade de aplicação:","options":["a)  se desdobra em aplicação direta e aplicação delegada;","b)  dá suporte ao controle das vinculações de recursos legalmente previstas;","c)  deve ser observada exclusivamente no registro de operações intergovernamentais;","d)  objetiva evidenciar o impacto da aplicação dos recursos na área de atuação do ente;","e)  possibilita diferenciar transferências a instituições privadas com ou sem fins lucrativos."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nA modalidade de aplicação indica se os recursos serão aplicados diretamente pelo ente ou transferidos a outro ente ou instituição.\n\nEla permite identificar, por exemplo:\n• transferências a instituições privadas sem fins lucrativos;\n• transferências a instituições privadas com fins lucrativos;\n• aplicações diretas;\n• transferências a outros entes da Federação.\n\nPor isso, possibilita diferenciar transferências destinadas a instituições privadas com ou sem fins lucrativos."},{"bank":"FGV - AA (DNIT)/DNIT/Contabilidade/2024","num":"40","stem":"Uma entidade do setor público apresentava os seguintes elementos de despesa e seus respectivos saldos: Serviços de Consultoria: R$16.000; Juros, Deságios e Descontos da Dívida Mobiliária: R$27.000; Serviços de Tecnologia da Informação e Comunicação – Pessoa Jurídica: R$38.000; Contratação por Tempo Determinado: R$42.000; Pensões: R$55.000; Correção Monetária ou Cambial da Dívida Contratual Resgatada: R$63.000; Obrigações Patronais: R$84.000; Aposentadorias, Reserva Remunerada e Reformas: R$120.000.<br><br>\n\nEm relação aos grupos de natureza da despesa orçamentária, assinale a opção que indica o saldo em Pessoal e Encargos Sociais.","options":["a)  R$259.000.","b)  R$301.000.","c)  R$355.000.","d)  R$421.000.","e)  R$475.000."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nIntegram o grupo Pessoal e Encargos Sociais:\n\n• Contratação por Tempo Determinado: R$ 42.000;\n• Pensões: R$ 55.000;\n• Obrigações Patronais: R$ 84.000;\n• Aposentadorias, Reserva Remunerada e Reformas: R$ 120.000.\n\nCálculo:\n\nR$ 42.000\n+ R$ 55.000\n+ R$ 84.000\n+ R$ 120.000\n= R$ 301.000.\n\nOs serviços de consultoria e de tecnologia da informação são Outras Despesas Correntes. Os juros, deságios, descontos e correções da dívida pertencem ao grupo Juros e Encargos da Dívida."}]},{"id":5,"start":41,"end":50,"questions":[{"bank":"FGV - AJ (TJ AP)/TJ AP/Apoio Especializado/Contador/2024","num":"41","stem":"Em seu primeiro mandato à frente do governo de um estado da federação, um governador se deparou com a complexidade técnica da linguagem orçamentária. Durante a campanha, ele havia se comprometido a promover uma transformação na qualidade do ensino no estado. Para compreender melhor os programas em curso nessa área, ele solicitou um diagnóstico elaborado em conjunto pelas secretarias de planejamento e educação.<br><br>\n\nO governador pediu um relato claro e objetivo que pudesse responder às seguintes questões:<br><br>\n\n- O que está sendo desenvolvido para alcançar os objetivos dos programas na área de educação no estado?<br><br>\n\n- Como está sendo feito?<br><br>\n\n- Quais os resultados (produtos) esperados?<br><br>\n\n- Como os programas estão sendo mensurados ou avaliados?<br><br>\n\nEssas perguntas do governador podem ser respondidas a partir de uma análise adequada das despesas da área de educação, considerando a seguinte categoria:","options":["a)  ação;","b)  subfunção;","c)  elemento de despesa;","d)  natureza de despesa;","e)  modalidade de aplicação."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA ação orçamentária é o instrumento que detalha como os objetivos de um programa serão alcançados.\n\nEla permite identificar:\n• o que está sendo desenvolvido;\n• como será executado;\n• qual produto ou resultado será entregue;\n• como a execução será mensurada.\n\nAs ações podem ser classificadas como projeto, atividade ou operação especial. Por isso, a análise da ação responde diretamente às perguntas formuladas pelo governador.\n\nA subfunção mostra uma área mais específica de atuação governamental. O elemento de despesa detalha o objeto do gasto. A natureza da despesa indica a classificação econômica e a modalidade de aplicação mostra como e por quem os recursos serão aplicados."},{"bank":"FGV - Ana Leg (ALEP)/ALEP/Administrador/2024","num":"42","stem":"A classificação das receitas correntes, das despesas correntes e de capital é essencial para a adequada gestão financeira do setor público.<br><br>\n\nCom relação à classificação das receitas correntes, das despesas correntes e de capital, analise os itens a seguir.<br><br>\n\nI. A receita industrial é um exemplo de receita corrente.<br><br>\n\nII. Manutenção de equipamentos é um exemplo de despesa corrente.<br><br>\n\nIII. Compra de equipamentos é um exemplo de despesa de capital.<br><br>\n\nEstá correto o que se afirma em","options":["a)  I, apenas.","b)  I e II, apenas.","c)  I e III, apenas.","d)  II e III, apenas.","e)  I, II e III."],"answer":"e","explanation":"A alternativa correta é a letra E.\n\nOs três itens estão corretos.\n\nI. A receita industrial é classificada como receita corrente, pois decorre da atividade industrial exercida pelo ente público.\n\nII. A manutenção de equipamentos é uma despesa corrente, pois está relacionada à conservação e ao funcionamento normal dos bens e serviços públicos.\n\nIII. A compra de equipamentos é despesa de capital, pois resulta na aquisição de material permanente e na incorporação de um ativo ao patrimônio público.\n\nLogo, estão corretas as afirmações I, II e III."},{"bank":"FGV - Ana Leg III (ALESC)/ALESC/Administrador/2024","num":"43","stem":"Em uma entidade do setor público, podem ser classificadas como “Outras Despesas Correntes” as despesas orçamentárias com","options":["a)  softwares, planejamento e execução de obras, aquisição de instalações, equipamentos e material permanente.","b)  aquisição de material de consumo, pagamento de diárias,\n\ncontribuições, subvenções, auxílio-alimentação e auxílio- transporte.","c)  pagamento de juros, comissões e outros encargos de operações de crédito internas e externas contratadas.","d)  pessoal ativo, inativo e pensionistas, relativas a mandatos eletivos, cargos, funções ou empregos, civis, militares e de membros de Poder.","e)  pagamento e/ou refinanciamento do principal e da atualização monetária ou cambial da dívida pública interna e externa, contratual ou mobiliária."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nO grupo Outras Despesas Correntes reúne despesas de manutenção que não se enquadram em Pessoal e Encargos Sociais nem em Juros e Encargos da Dívida.\n\nEntre elas estão:\n• material de consumo;\n• diárias;\n• contribuições;\n• subvenções;\n• auxílio-alimentação;\n• auxílio-transporte.\n\nAs demais alternativas correspondem a outros grupos:\n• softwares, obras, instalações, equipamentos e material permanente: investimentos;\n• juros e encargos de operações de crédito: juros e encargos da dívida;\n• pessoal ativo, inativo e pensionistas: pessoal e encargos sociais;\n• pagamento ou refinanciamento do principal da dívida: amortização da dívida."},{"bank":"FGV - CL (CM Fortal)/CM Fortaleza/Orçamento e Finanças Públicas/2024","num":"44","stem":"Relacione as despesas à respectiva definição:<br><br>\n\n1. Despesas de capital<br><br>\n\n2. Despesas extraorçamentárias<br><br>\n\n3. Despesas produtivas<br><br>\n\n4. Despesas correntes<br><br>\n\n(  ) Gastos para a produção ou geração de novos bens ou serviços que integrarão o patrimônio público.<br><br>\n\n(  ) Gastos de manutenção e funcionamento dos serviços públicos em geral.<br><br>\n\n(  ) Despesas que não precisam de autorização legislativa para ser realizadas.<br><br>\n\n(  ) Despesas que, além de satisfazer necessidades públicas, enriquecem o patrimônio do Estado ou aumentam a capacidade econômica do contribuinte.<br><br>\n\nAssinale a opção que indica a relação correta, na ordem apresentada.","options":["a)  1 – 4 – 2 – 3.","b)  3 – 4 – 1 – 2.","c)  4 – 2 – 3 – 1.","d)  2 – 3 – 4 – 1.","e)  3 – 1 – 4 – 2."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA sequência correta é 1 – 4 – 2 – 3.\n\n1. Despesas de capital:\nGastos destinados à produção ou aquisição de novos bens ou serviços que integrarão o patrimônio público.\n\n4. Despesas correntes:\nGastos necessários à manutenção e ao funcionamento dos serviços públicos.\n\n2. Despesas extraorçamentárias:\nSaídas financeiras que não dependem de nova autorização legislativa, pois resultam da devolução de recursos de terceiros ou de obrigações já reconhecidas.\n\n3. Despesas produtivas:\nDespesas que, além de satisfazer necessidades públicas, aumentam o patrimônio estatal ou a capacidade econômica da coletividade."},{"bank":"FGV - Ana Leg (ALEP)/ALEP/Contador/2024","num":"45","stem":"De acordo com a Lei nº 4.320/64, as subvenções sociais e econômicas são classificadas como despesas","options":["a)  de Capital, como Investimentos.","b)  Correntes, como Despesas de custeio.","c)  de Capital, como Inversões financeiras.","d)  Correntes, como Transferências correntes.","e)  de Capital, como Transferências de capital."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nAs subvenções sociais e econômicas são despesas correntes classificadas como transferências correntes.\n\nSubvenções sociais são destinadas, em regra, a instituições públicas ou privadas de caráter assistencial ou cultural, sem finalidade lucrativa.\n\nSubvenções econômicas podem ser destinadas a empresas públicas ou privadas em hipóteses previstas em lei, como cobertura de déficit de manutenção.\n\nComo não correspondem à aquisição direta de bens ou serviços pelo Estado e possuem natureza corrente, são classificadas como transferências correntes."},{"bank":"FGV - Tec NS (TJ MS)/TJ MS/Analista Técnico-Contábil/2024","num":"46","stem":"A Secretaria de Estado de Infraestrutura de uma unidade da federação, em atenção a uma das prioridades elencadas no planejamento da gestão, está conduzindo um projeto de ampliação da malha rodoviária estadual para melhorar o escoamento da produção agropecuária da região, com investimentos da ordem de R$ 79 milhões. Os investimentos serão custeados com recursos de operação de crédito legalmente autorizada. Sob a ótica da natureza da despesa, trata-se de uma despesa de capital, no grupo investimentos, modalidade de aplicação direta.<br><br>\n\nÀ luz das informações apresentadas e dos requisitos para classificação da despesa dispostos no Manual Técnico de Orçamento (MTO), a referida despesa deve também ser classificada:","options":["a)  como primária discricionária;","b)  na função Organização Agropecuária;","c)  como operação especial, dada a fonte de recursos;","d)  com o IDUSO relativo a recursos destinados a contrapartidas;","e)  como obrigatória de caráter continuado, pela necessidade de manutenção."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA ampliação da malha rodoviária é uma despesa de investimento e depende de decisão alocativa do governo. Não decorre de obrigação constitucional ou legal de execução automática.\n\nPor isso, a despesa é classificada como primária discricionária.\n\nAs demais alternativas estão incorretas:\n• a função deve refletir a área principal de atuação, relacionada ao transporte, e não à organização agropecuária;\n• o fato de os recursos virem de operação de crédito não transforma a ação em operação especial;\n• o IDUSO de contrapartida somente seria aplicável se houvesse contrapartida vinculada a operação específica;\n• a despesa não é obrigatória de caráter continuado, pois se trata de projeto de investimento com duração determinada."},{"bank":"FGV - CInt (Pref Caraguatatuba)/Pref Caraguatatuba/2024","num":"47","stem":"Em uma entidade do setor público, a amortização e os juros da dívida pública são classificados, respectivamente, como","options":["a)  investimentos e despesas de custeio.","b)  inversões financeiras e despesas de custeio.","c)  transferências de capital e despesas de custeio.","d)  transferências de capital e transferências correntes.","e)  inversões financeiras e transferências correntes."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nA amortização da dívida corresponde ao pagamento do principal e é classificada como transferência de capital.\n\nOs juros da dívida representam o custo financeiro do endividamento e são classificados como transferências correntes.\n\nAssim:\n• amortização da dívida: transferência de capital;\n• juros da dívida: transferência corrente.\n\nEssa é a combinação apresentada na alternativa D."},{"bank":"FGV - Tec (Pref Caraguatatuba)/Pref Caraguatatuba/Contabilidade/2024","num":"48","stem":"Em relação às despesas públicas, são despesas correntes","options":["a)  os investimentos.","b)  as despesas de custeio.","c)  as inversões financeiras.","d)  a aquisição de imóveis.","e)  a constituição de Fundos Rotativos."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nAs despesas de custeio são despesas correntes destinadas à manutenção dos serviços públicos.\n\nSão exemplos:\n• material de consumo;\n• serviços de terceiros;\n• manutenção de equipamentos;\n• despesas administrativas;\n• gastos com pessoal, conforme a classificação prevista na Lei nº 4.320/1964.\n\nInvestimentos, inversões financeiras, aquisição de imóveis e constituição de fundos rotativos são despesas de capital."},{"bank":"FGV - Ana (TJ SC)/TJ SC/Administrativo/2024","num":"49","stem":"Ao assumir a gestão da Secretaria de Meio Ambiente de um estado da Federação, o secretário solicitou um levantamento dos projetos implementados no último quadriênio que apresentaram resultados positivos.<br><br>\n\nPara atender à solicitação do secretário, as informações sobre as despesas na área devem ser consultadas pela classificação:","options":["a)  funcional;","b)  programática;","c)  por esfera orçamentária;","d)  por modalidade de aplicação;","e)  segundo a natureza da despesa."],"answer":"b","explanation":"A alternativa correta é a letra B.\n\nA classificação programática organiza a despesa por programas e ações, permitindo identificar:\n• objetivos;\n• projetos e atividades;\n• produtos entregues;\n• metas;\n• resultados alcançados.\n\nComo o secretário deseja conhecer os projetos implementados e avaliar seus resultados, deve consultar a classificação programática.\n\nA classificação funcional mostra a área de atuação. A modalidade de aplicação mostra como os recursos foram aplicados. A natureza da despesa mostra o objeto econômico do gasto."},{"bank":"FGV - ACE (TCE-GO)/TCE GO/Ciências Contábeis/2024","num":"50","stem":"A classificação da despesa pública é essencial para o controle e a gestão eficiente dos recursos governamentais, permitindo a identificação e a análise detalhada dos gastos de acordo com sua natureza, finalidade e órgão responsável.<br><br>\n\nAssinale a opção que indica o maior nível de agregação das diversas áreas de atuação do setor público.","options":["a) Função.","b) Subfunção.","c) Atividade.","d)  Projeto.","e) Classificação funcional."],"answer":"a","explanation":"A alternativa correta é a letra A.\n\nA função representa o maior nível de agregação das diversas áreas de atuação do setor público.\n\nExemplos de funções:\n• Saúde;\n• Educação;\n• Segurança Pública;\n• Assistência Social;\n• Transporte.\n\nA subfunção detalha uma área específica dentro da função. Atividade e projeto são tipos de ações orçamentárias. A expressão classificação funcional representa o sistema formado por função e subfunção, mas não é um nível individual de agregação."}]},{"id":6,"start":51,"end":60,"questions":[{"bank":"FGV - ACE (TCE-GO)/TCE GO/Ciências Contábeis/2024","num":"51","stem":"O Elemento de Despesa Orçamentária identifica os diferentes objetos de gastos, como salários, juros, materiais, serviços, subvenções, obras, equipamentos e outros utilizados pela administração pública para atingir seus objetivos.<br><br>\n\nAssinale a opção que indica o Elemento de Despesa Orçamentária referente aos encargos da entidade patrocinadora no regime de previdência fechada, para complementação de aposentadoria.","options":["a)  01 – Aposentadorias, Reserva Remunerada e Reformas.","b)  03 – Pensões.","c)  06 – Benefício Mensal ao Deficiente e ao Idoso.","d)  07 - Contribuição a Entidades Fechadas de Previdência.","e)  13 – Obrigações Patronais."],"answer":"d","explanation":"A alternativa correta é a letra D.\n\nO elemento 07 — Contribuição a Entidades Fechadas de Previdência — é utilizado para registrar os encargos da entidade patrocinadora destinados à complementação de aposentadoria no regime de previdência fechada.\n\nAs demais opções representam objetos de gasto distintos:\n• 01: aposentadorias, reserva remunerada e reformas;\n• 03: pensões;\n• 06: benefício mensal ao deficiente e ao idoso;\n• 13: obrigações patronais.\n\nPortanto, o elemento correto é o 07."},{"bank":"FGV - Ana (CVM)/CVM/Gestão/2024","num":"52","stem":"Uma Unidade Orçamentária (UO), na sua atuação no processo orçamentário, compreendeu a consolidação e formalização de sua proposta orçamentária da despesa por:","options":["a)  objetivo, programa e função;","b)  programa, função e ação;","c)  programa, ação e subtítulo;","d)  programa, função e subfunção;","e)  programa, origem e função."],"answer":"c","explanation":"A alternativa correta é a letra C.\n\nA proposta orçamentária da despesa é estruturada por:\n• programa;\n• ação;\n• subtítulo.\n\nO programa organiza a atuação governamental em torno de objetivos. A ação representa a operação da qual resultam produtos ou serviços. O subtítulo localiza ou detalha territorialmente a ação orçamentária.\n\nAs demais alternativas misturam classificações funcionais ou elementos que não formam essa estrutura de consolidação da proposta."},{"bank":"FGV - Ana (CVM)/CVM/Gestão/2024","num":"53","stem":"A Lei de Diretrizes Orçamentárias (LDO), em relação à meta fiscal, prevê para 2025: “Com menores resultados fiscais, a dívida pública deverá subir de 76,6% do PIB em 2024 para 79,7% em 2027. A projeção final da LDO é para 2034, quando a dívida chegaria a 74,5%. ‘Essa situação é explicada pela previsão de taxas de juros reais acima da taxa estrutural de equilíbrio, resultando em um custo real de financiamento da dívida pública superior à taxa real de crescimento econômico. Isso dificulta a estabilização da dívida durante o período
